<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" preserveAspectRatio="none">
  <defs>
    <filter id="mist" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .03" numOctaves="4" seed="21"/>
      <feColorMatrix values="0 0 0 0 .64  0 0 0 0 .76  0 0 0 0 .84  2.1 0 0 0 -.74"/>
    </filter>
    <radialGradient id="fade" gradientTransform="translate(0 .13) scale(1 .82)">
      <stop offset=".16" stop-color="white"/>
      <stop offset=".68" stop-color="white" stop-opacity=".64"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="edges"><rect width="640" height="160" fill="url(#fade)"/></mask>
  </defs>
  <g mask="url(#edges)"><rect width="640" height="160" filter="url(#mist)"/></g>
</svg>
