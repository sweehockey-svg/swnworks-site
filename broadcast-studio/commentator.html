<body data-commentary-role="presenter"><main><h1>Kommentera i Match-TV</h1><p class="intro">Du kommenterar från din plats. Studion sköter matchbild och grafik. Använd hörlurar.</p><div id="commentatorControls"></div><iframe id="broadcast" src="SV/?obs=1&amp;viewer=1" title="Matchbild från studion" allow="autoplay; fullscreen" allowfullscreen></iframe><div class="monitor-controls"><button id="matchAudio" type="button" aria-pressed="false">Slå på matchljud</button></div></main><script src="broadcast-config.js?v=2"></script><script src="commentary.js?v=20261008-audio-2"></script><script>(()=>{let muted=true;const frame=document.getElementById('broadcast'),button=document.getElementById('matchAudio');const update=()=>frame.contentWindow?.postMessage({type:'seh-tv-audio',muted},location.origin);button.onclick=()=>{muted=!muted;button.textContent=muted?'Slå på matchljud':'Stäng av matchljud';button.setAttribute('aria-pressed',String(!muted));update();};frame.addEventListener('load',update);})();</script></body></html>
