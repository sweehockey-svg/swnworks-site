<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Presentatörsvy · SWNWORKS</title>
  <link rel="stylesheet" href="commentator-notes.css?v=20261108-1">
  <style>
    body{margin:0;background:#06111a;color:#eef7ff;font:16px/1.5 Arial,sans-serif}
    main{margin:0;padding:4px clamp(10px,1.15vw,20px) 10px 6px}
    .commentator-workspace{gap:8px}
    .presenter-sidebar{display:grid;min-width:0;gap:6px}
    .presenter-audio{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;color:#aac1d0;font-size:11px}
    .presenter-audio button{padding:5px 9px;border:1px solid #345166;border-radius:5px;background:#0d1e2a;color:#eef7ff;font:700 12px Arial,sans-serif;cursor:pointer}
    .presenter-audio button[aria-pressed="true"]{border-color:#eac75f;color:#ffe079;background:#262215}
    .presenter-sidebar #privateNotes textarea{min-height:110px;height:clamp(110px,16vh,240px)}
    #presenterLineups{min-width:0;padding:7px 8px;border:1px solid #345166;border-radius:8px;background:#091923}
    #presenterLineups summary{cursor:pointer;color:#e5f2fb;font-size:13px;font-weight:800}
    #presenterLineupStatus{margin:5px 0 0;color:#aac1d0;font-size:11px}
    .presenter-lineup-team{min-width:0;margin-top:5px}
    .presenter-lineup-team+.presenter-lineup-team{padding-top:5px;border-top:1px dashed #456579}
    .presenter-lineup-team h3{margin:0 0 3px;color:#b7ccda;font-size:11px;line-height:1.2;overflow-wrap:anywhere}
    .presenter-lineup-team ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin:0;padding:0;list-style:none}
    .presenter-lineup-team li{min-width:0;padding:3px 4px 3px 7px;border-radius:4px;background:#102534;box-shadow:inset 2px 0 var(--chel-position,#eac75f);line-height:1.2}
    .presenter-lineup-team li[data-position="LW"]{--chel-position:#79df72}
    .presenter-lineup-team li[data-position="C"]{--chel-position:#ff7676}
    .presenter-lineup-team li[data-position="RW"]{--chel-position:#7fb9ff}
    .presenter-lineup-team li[data-position="LD"]{--chel-position:#58ddda}
    .presenter-lineup-team li[data-position="G"]{--chel-position:#cf9dff}
    .presenter-lineup-team li[data-position="RD"]{--chel-position:#ffda55}
    .presenter-lineup-team li small{display:block;color:var(--chel-position,#eac75f);font-size:9px;font-weight:800}
    .presenter-lineup-team li span{display:block;color:#eef7ff;font-size:11px;font-weight:700;overflow-wrap:anywhere}
    .presenter-lineup-team li button{display:block;width:100%;margin:0;padding:0;border:0;background:none;color:inherit;text-align:left;cursor:pointer}
    .presenter-lineup-team li button:enabled:hover span{color:#ffd36a;text-decoration:underline}
    .presenter-lineup-team li button:focus-visible{outline:2px solid #ffd36a;outline-offset:1px;border-radius:2px}
    .presenter-lineup-team li button:disabled{cursor:default}
    #broadcastPreview{position:relative;width:100%}
    #broadcast{width:100%;aspect-ratio:16/9;border:1px solid #345166;border-radius:10px;background:#000;display:block}
    #previewResize{position:absolute;right:2px;bottom:2px;width:26px;height:26px;display:grid;place-items:center;cursor:nwse-resize;touch-action:none;background:#06111ad9;color:#c7dce8;border-radius:5px 0 8px 0}
    #previewResize svg{pointer-events:none}
    #previewReset{position:absolute;right:32px;bottom:4px;min-height:22px;padding:2px 6px;border:1px solid #345166;border-radius:4px;background:#06111ae8;color:#eef7ff;font:700 10px Arial,sans-serif;cursor:pointer}
    #previewResize:focus-visible,#previewReset:focus-visible{outline:2px solid #ffd33d;outline-offset:-2px}
    #scenePicker,#seriesPicker{display:block;width:100%;height:32px;border:0}
    #scenePicker{margin-top:5px;height:67px}
    #lineupEditBar:not([hidden]){display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;color:#b7ccda;font-size:11px}
    #lineupEditBar button{border:1px solid #365367;border-radius:5px;background:#102534;color:#eef7ff;padding:5px 8px;font:700 11px Arial,sans-serif;cursor:pointer}
    #lineupEditBar button:disabled{opacity:.6;cursor:default}
    #lineupEditSave:not(:disabled){border-color:#ffd36a;color:#ffd36a}
    #lineupReservePicker:not([hidden]){display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex-basis:100%}
    #lineupReservePlayer{max-width:100%;color:#eef7ff;background:#0b1e2b;border:1px solid #526a7b;border-radius:4px;padding:5px}
    #presentPlayerMenu{position:fixed;z-index:10;box-sizing:border-box;width:min(300px,calc(100vw - 16px));overflow:auto;padding:9px;border:1px solid #587285;border-radius:8px;background:#0c202d;box-shadow:0 10px 28px #000a}
    #presentPlayerMenu h2,#presentPlayerMenu h3{margin:5px 0;color:#ffd36a;font-size:12px}
    #presentPlayerMenu p{margin:6px 0;font-size:12px}
    #presentPlayerMenu button{display:block;width:100%;margin:3px 0;padding:6px 8px;border:1px solid #314c5e;border-radius:4px;background:#102939;color:#eef7ff;text-align:left;cursor:pointer}
    #presentPlayerMenu button:hover,#presentPlayerMenu button:focus-visible{outline:2px solid #ffd36a;outline-offset:-2px}
    #presentPlayerError{color:#ffd36a;margin:4px 0;font-size:12px}
    .presenter-feed-row{display:flex;align-items:flex-start;flex-wrap:wrap;gap:8px;min-width:0}
    .original-feed{width:min(100%,210px);margin:0;min-width:0}
    .original-feed figcaption{margin:0 0 3px;color:#aac1d0;font-size:11px;font-weight:800}
    #originalFeed{box-sizing:border-box;display:block;width:100%;aspect-ratio:16/9;border:1px solid #345166;border-radius:6px;background:#030b12}
    #streamPicker{display:block;flex:1 1 132px;min-width:0;height:0;border:0}
    #studioTools{margin:20px 0 0;padding:8px 10px;border:1px solid #345166;border-radius:8px;background:#091923}
    #studioTools>summary{cursor:pointer;color:#dcecf6;font-size:13px;font-weight:800}
    #studioToolsHint{margin:8px 0;color:#aac1d0;font-size:12px}
    #studioToolsFrame{box-sizing:border-box;display:block;width:100%;height:clamp(500px,82svh,1000px);border:1px solid #345166;border-radius:6px;background:#06111a}
    @media(min-width:880px){
      .commentator-workspace:has(>.presenter-sidebar){
        --notes-width:clamp(245px,22vw,410px);
        grid-template-columns:minmax(0,min(calc(100% - var(--notes-width) - 8px),var(--match-width,100%))) minmax(var(--notes-width),1fr);
      }
    }
    @media(min-width:880px) and (min-height:500px){
      .commentator-workspace{--match-width:calc((100svh - 96px)*16 / 9)}
      #broadcastPreview,#scenePicker{width:min(100%,var(--match-width))}
    }
    /* Leave the control column and sidebar alone; only the video gives up space. */
    @media (max-height:800px){
      #broadcastPreview{max-width:max(220px,calc((100svh - 144px)*16 / 9))}
    }
    @media (min-width:880px) and (max-width:1440px){
      #broadcastPreview{max-width:min(94%,max(220px,calc((100svh - 144px)*16 / 9)))}
    }
    #broadcastPreview[data-manual-size]{width:min(100%,var(--preview-width));max-width:none}
  </style>
</head>
<body data-commentary-role="obs-presenter">
<main>
  <div class="commentator-workspace">
    <section class="commentator-match">
      <div id="broadcastPreview">
        <iframe id="broadcast" title="Matchbild från studion" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <button type="button" id="previewReset" hidden>Auto</button>
        <div id="previewResize" role="slider" tabindex="0" aria-controls="broadcast" aria-label="Storlek på sändningsbilden">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 13 13 3M7 13l6-6m-2 6 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
      </div>
      <div id="lineupEditBar" hidden>
        <button id="lineupEditStart" type="button">Redigera laguppställning</button>
        <button id="lineupEditSave" type="button" hidden>Spara i sändningen</button>
        <button id="lineupEditCancel" type="button" hidden>Avbryt</button>
        <span id="lineupEditHint" role="status"></span>
        <div id="lineupReservePicker" hidden>
          <label for="lineupReservePlayer" id="lineupReserveLabel"></label>
          <select id="lineupReservePlayer"></select>
          <button type="button" id="lineupReserveClose">Stäng</button>
        </div>
      </div>
      <iframe id="scenePicker" title="Scenval" loading="lazy"></iframe>
      <p id="presentPlayerError" role="status" hidden></p>
    </section>
    <aside class="presenter-sidebar">
    <div class="presenter-audio">
      <button type="button" id="presenterAudio" aria-pressed="false" aria-describedby="presenterAudioHint">Lyssna här</button>
      <span id="presenterAudioHint">Bara i den här fliken · påverkar inte OBS</span>
    </div>
    <details id="presenterLineups" open>
      <summary>Laguppställningar</summary>
      <p id="presenterLineupStatus">Ingen aktiv laguppställning ännu.</p>
      <div id="presenterLineupTeams"></div>
    </details>
    <details id="privateNotes" open hidden>
      <summary>Egna anteckningar</summary>
      <p class="notes-hint" id="privateNotesHint"></p>
      <textarea maxlength="12000" autocomplete="off" spellcheck="false" aria-describedby="privateNotesHint"></textarea>
      <p class="notes-status" role="status"></p>
    </details>
    <iframe id="seriesPicker" title="Serieläge" loading="lazy"></iframe>
    <div class="presenter-feed-row">
      <figure class="original-feed">
        <figcaption id="originalFeedLabel">Originalstream · utan ljud</figcaption>
        <iframe id="originalFeed" title="Originalstream" loading="lazy" allow="autoplay"></iframe>
      </figure>
      <iframe id="streamPicker" title="Byt matchstream"></iframe>
    </div>
    </aside>
  </div>
  <details id="studioTools">
    <summary id="studioToolsTitle">Fler studioverktyg</summary>
    <p id="studioToolsHint">Separat arbetsyta för att förbereda matchen och styra sändningen. Kräver studioadmin.</p>
    <iframe id="studioToolsFrame" title="Fler studioverktyg" allow="autoplay; fullscreen; microphone; display-capture" allowfullscreen></iframe>
  </details>
</main>
<div id="presentPlayerMenu" role="dialog" aria-labelledby="presentPlayerTitle" hidden></div>
<script>
(() => {
  const labels={
    sv:["Presentatörsvy","Matchbild från studion","SV","Scenval"],
    en:["Presenter view","Match feed from the studio","en","Scene controls"],
    fi:["Esittäjänäkymä","Ottelukuva studiosta","fi","Näkymän valinta"],
    de:["Moderationsansicht","Spielbild aus dem Studio","de","Szenensteuerung"]
  };
  const requested=new URLSearchParams(location.search).get("lang")?.toLowerCase();
  const lang=Object.hasOwn(labels,requested)?requested:"sv";
  const [heading,title,path,sceneTitle]=labels[lang];
  document.documentElement.lang=lang;
  document.title=heading+" · SWNWORKS";
  const frame=document.getElementById("broadcast");
  const preview=document.getElementById("broadcastPreview"),grip=document.getElementById("previewResize"),reset=document.getElementById("previewReset");
  const resizeWords={
    sv:["Storlek på sändningsbilden","Återställ automatisk storlek"],
    en:["Broadcast preview size","Reset automatic size"],
    fi:["Lähetyskuvan koko","Palauta automaattinen koko"],
    de:["Größe der Sendevorschau","Automatische Größe wiederherstellen"]
  }[lang];
  grip.title=resizeWords[0];grip.setAttribute("aria-label",resizeWords[0]);
  reset.title=resizeWords[1];reset.setAttribute("aria-label",resizeWords[1]);
  const sizeKey="swn-presenter-preview-width-v1";
  let manualWidth=null,drag=null;
  const maxWidth=()=>Math.max(1,Math.floor(preview.parentElement.getBoundingClientRect().width));
  const minWidth=()=>Math.min(240,maxWidth());
  const size=()=>Math.round(preview.getBoundingClientRect().width);
  const syncGrip=()=>{
    grip.setAttribute("aria-valuemin",String(Math.min(minWidth(),size())));
    grip.setAttribute("aria-valuemax",String(Math.max(maxWidth(),size())));
    grip.setAttribute("aria-valuenow",String(size()));
    grip.setAttribute("aria-valuetext",size()+" px");
  };
  const applySize=width=>{
    manualWidth=width;
    preview.toggleAttribute("data-manual-size",width!==null);
    if(width!==null)preview.style.setProperty("--preview-width",width+"px");
    else preview.style.removeProperty("--preview-width");
    reset.hidden=width===null;
    syncGrip();
  };
  const setSize=width=>applySize(Math.max(minWidth(),Math.min(maxWidth(),Math.round(width))));
  const rememberSize=()=>{try{
    if(manualWidth===null)localStorage.removeItem(sizeKey);
    else localStorage.setItem(sizeKey,String(manualWidth));
  }catch{}};
  const autoSize=()=>{if(document.activeElement===reset)grip.focus({preventScroll:true});applySize(null);rememberSize();};
  try{
    const stored=Number(localStorage.getItem(sizeKey));
    if(Number.isInteger(stored)&&stored>0&&stored<=10000)applySize(stored);
  }catch{}
  const gripSize=new ResizeObserver(syncGrip);
  gripSize.observe(preview);gripSize.observe(preview.parentElement);syncGrip();
  grip.addEventListener("pointerdown",event=>{
    if(!event.isPrimary||event.button!==0)return;
    grip.focus({preventScroll:true});grip.setPointerCapture(event.pointerId);
    drag={id:event.pointerId,x:event.clientX,y:event.clientY,width:size(),changed:false};
    event.preventDefault();
  });
  grip.addEventListener("pointermove",event=>{
    if(drag?.id!==event.pointerId)return;
    const dx=event.clientX-drag.x,dy=(event.clientY-drag.y)*16/9;
    const delta=Math.abs(dx)>=Math.abs(dy)?dx:dy;
    if(!drag.changed&&Math.abs(delta)<3)return;
    drag.changed=true;setSize(drag.width+delta);
  });
  const endDrag=event=>{if(drag?.id!==event.pointerId)return;if(drag.changed)rememberSize();drag=null;};
  ["pointerup","pointercancel","lostpointercapture"].forEach(type=>grip.addEventListener(type,endDrag));
  reset.addEventListener("click",autoSize);
  grip.addEventListener("dblclick",autoSize);
  grip.addEventListener("keydown",event=>{
    const direction={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1}[event.key];
    if(direction){setSize(size()+direction*(event.shiftKey?80:24));rememberSize();}
    else if(event.key==="Home"||event.key==="Escape")autoSize();
    else if(event.key==="End"){setSize(maxWidth());rememberSize();}
    else return;
    event.preventDefault();
  });
  frame.title=title;
  const audioLabels={sv:["Lyssna här","Bara i den här fliken · påverkar inte OBS"],en:["Listen here","This tab only · does not affect OBS"],fi:["Kuuntele tässä","Vain tässä välilehdessä · ei vaikuta OBS:ään"],de:["Hier mithören","Nur dieser Tab · kein Einfluss auf OBS"]};
  const audioButton=document.getElementById("presenterAudio");
  audioButton.textContent=audioLabels[lang][0];
  document.getElementById("presenterAudioHint").textContent=audioLabels[lang][1];
  let localAudio=false;
  const updateLocalAudio=()=>frame.contentWindow?.postMessage({type:"seh-tv-audio",muted:!localAudio},location.origin);
  audioButton.onclick=()=>{localAudio=!localAudio;audioButton.setAttribute("aria-pressed",String(localAudio));updateLocalAudio();};
  frame.addEventListener("load",updateLocalAudio);
  const lineupLabels={sv:["Laguppställningar","Ingen aktiv laguppställning ännu."],en:["Starting lineups","No active lineup yet."],fi:["Kokoonpanot","Ei aktiivista kokoonpanoa."],de:["Aufstellungen","Noch keine aktive Aufstellung."]};
  const lineupPanel=document.getElementById("presenterLineups"),lineupStatus=document.getElementById("presenterLineupStatus"),lineupTeams=document.getElementById("presenterLineupTeams");
  lineupPanel.querySelector("summary").textContent=lineupLabels[lang][0];
  lineupStatus.textContent=lineupLabels[lang][1];
  const positions=[["RD","G","LD","RW","C","LW"],["LW","C","RW","LD","G","RD"]];
  const scenePicker=document.getElementById("scenePicker"),playerMenu=document.getElementById("presentPlayerMenu"),playerError=document.getElementById("presentPlayerError");
  const playerText=({
    sv:["Spelarpresentation","Trupperna är inte tillgängliga för den här matchen ännu.","Stäng","Spelaren kunde inte visas. Kontrollera sändningen och försök igen."],
    en:["Player presentation","Rosters are not available for this match yet.","Close","Could not show the player. Check the broadcast and try again."],
    fi:["Pelaajaesittely","Tämän ottelun pelaajalistat eivät ole vielä saatavilla.","Sulje","Pelaajaa ei voitu näyttää. Tarkista lähetys ja yritä uudelleen."],
    de:["Spielervorstellung","Die Kader für dieses Spiel sind noch nicht verfügbar.","Schließen","Der Spieler konnte nicht angezeigt werden. Prüfe die Sendung und versuche es erneut."]
  })[lang];
  let playerRoster=null,playerRequest=null;
  const playerAnchor=()=>scenePicker.contentDocument?.getElementById("presentPlayerButton");
  const postPlayer=data=>scenePicker.contentWindow?.postMessage(data,location.origin);
  const canSelectPlayer=()=>playerAnchor()?.disabled===false;
  const lineupEditText=({
    sv:["Redigera laguppställning","Spara i sändningen","Avbryt","Dra för att byta position. Klicka på en ruta för att välja reserv. Ändringen syns bara här tills du sparar.","Sparar…","Sparat i sändningen.","Kunde inte bekräfta ändringen. Kontrollera uppställningen och försök igen.","Välj reserv","Inga lediga reserver i den inlästa truppen","Stäng"],
    en:["Edit lineup","Save on air","Cancel","Drag to swap positions. Click a slot to pick a reserve. Only you see the change until you save.","Saving…","Saved on air.","Could not confirm the change. Check the lineup and try again.","Choose reserve","No available reserves in the loaded roster","Close"],
    fi:["Muokkaa kokoonpanoa","Tallenna lähetykseen","Peruuta","Vaihda paikkaa vetämällä. Valitse varapelaaja napsauttamalla paikkaa. Muutos näkyy muille vasta tallennuksen jälkeen.","Tallennetaan…","Tallennettu lähetykseen.","Muutosta ei voitu vahvistaa. Tarkista kokoonpano ja yritä uudelleen.","Valitse varapelaaja","Ladatussa kokoonpanossa ei ole vapaita varapelaajia","Sulje"],
    de:["Aufstellung bearbeiten","In der Sendung speichern","Abbrechen","Ziehe Spieler auf andere Positionen. Klicke auf eine Position, um Ersatz zu wählen. Die Änderung bleibt bis zum Speichern privat.","Wird gespeichert…","In der Sendung gespeichert.","Änderung nicht bestätigt. Prüfe die Aufstellung und versuche es erneut.","Ersatz wählen","Keine verfügbaren Ersatzspieler im geladenen Kader","Schließen"]
  })[lang];
  const lineupBar=document.getElementById("lineupEditBar"),lineupStart=document.getElementById("lineupEditStart"),
    lineupSave=document.getElementById("lineupEditSave"),lineupCancel=document.getElementById("lineupEditCancel"),lineupHint=document.getElementById("lineupEditHint");
  const reservePicker=document.getElementById("lineupReservePicker"),reservePlayer=document.getElementById("lineupReservePlayer"),
    reserveLabel=document.getElementById("lineupReserveLabel"),reserveClose=document.getElementById("lineupReserveClose");
  reserveClose.textContent=lineupEditText[9];
  [lineupStart,lineupSave,lineupCancel].forEach((button,i)=>{button.textContent=lineupEditText[i];});
  let lineupAvailable=false,lineupEditing=false,lineupChanged=false,lineupSaving=false,lineupSaved=false,lineupFeedback="";
  let reserveTarget=null;
  const lineupMessage=(action,extra={})=>frame.contentWindow?.postMessage({type:"seh-presenter-lineup-edit",action,...extra},location.origin);
  const closeReserve=()=>{reserveTarget=null;reservePicker.hidden=true;};
  reserveClose.onclick=()=>{closeReserve();lineupMessage("close-reserves");};
  reservePlayer.onchange=()=>{
    const id=reservePlayer.value,target=reserveTarget;
    if(!id||!target||!canSelectPlayer()||lineupSaving)return;
    closeReserve();lineupMessage("reserve",{...target,id});
  };
  reservePicker.addEventListener("keydown",event=>{
    if(event.key==="Escape"&&!reservePicker.hidden){event.preventDefault();reserveClose.click();}
  });
  const renderLineupTools=()=>{
    const enabled=canSelectPlayer();
    lineupBar.hidden=!lineupEditing&&!lineupSaving&&!(lineupAvailable&&enabled)&&!lineupFeedback;
    lineupStart.hidden=lineupEditing||!lineupAvailable||!enabled;
    lineupStart.disabled=lineupSaving;
    lineupSave.hidden=lineupCancel.hidden=!lineupEditing;
    lineupSave.disabled=!enabled||!lineupChanged||lineupSaving||lineupSaved;
    lineupCancel.disabled=lineupSaving||lineupSaved;
    if(!lineupEditing||lineupSaving)closeReserve();
    reservePlayer.disabled=!enabled||reservePlayer.options.length<=1;
    lineupHint.textContent=lineupSaving?lineupEditText[4]:lineupFeedback||(lineupEditing?lineupEditText[3]:"");
  };
  lineupStart.onclick=()=>{lineupFeedback="";lineupSaved=false;lineupMessage("start");renderLineupTools();};
  lineupCancel.onclick=()=>{lineupFeedback="";lineupMessage("cancel");};
  lineupSave.onclick=()=>{lineupFeedback="";lineupMessage("save");};
  const selectPlayer=(ticket,team,id)=>{
    if(!canSelectPlayer()||playerRoster?.ticket!==ticket)return false;
    playerError.hidden=true;
    postPlayer({type:"seh-presenter-player-select",ticket,team,id});
    return true;
  };
  const playerAction=({
    sv:name=>"Visa "+name+" i sändningen",
    en:name=>"Show "+name+" on air",
    fi:name=>"Näytä "+name+" lähetyksessä",
    de:name=>name+" in der Sendung zeigen"
  })[lang];
  const updateLineupButtons=()=>{
    const enabled=canSelectPlayer();
    for(const button of lineupTeams.querySelectorAll("button"))button.disabled=!enabled;
    frame.contentWindow?.postMessage({type:"seh-presenter-lineup-control",enabled},location.origin);
    renderLineupTools();
  };
  frame.addEventListener("load",updateLineupButtons);
  const closePlayers=(focus=false)=>{
    if(playerMenu.hidden)return;
    playerMenu.hidden=true;playerRequest=null;
    postPlayer({type:"seh-presenter-player-expanded",expanded:false});
    if(focus)playerAnchor()?.focus({preventScroll:true});
  };
  const placePlayerMenu=()=>{
    const anchor=playerAnchor()?.getBoundingClientRect(),frameRect=scenePicker.getBoundingClientRect();
    if(!anchor)return closePlayers();
    const top=frameRect.top+anchor.top;
    if(top<50||top>=innerHeight)return closePlayers();
    playerMenu.style.left=Math.max(8,Math.min(frameRect.left+anchor.left,innerWidth-playerMenu.offsetWidth-8))+"px";
    playerMenu.style.bottom=(innerHeight-top+5)+"px";
    playerMenu.style.maxHeight=Math.min(innerHeight*.55,top-13)+"px";
  };
  const buildPlayerMenu=(focus=false)=>{
    const req=playerRequest;
    if(!req)return;
    const title=document.createElement("h2");title.id="presentPlayerTitle";title.textContent=playerText[0];
    const close=document.createElement("button");close.type="button";close.textContent=playerText[2];close.onclick=()=>closePlayers(true);
    const sections=[title],teams=playerRoster?.ticket===req.ticket&&Array.isArray(playerRoster.teams)?playerRoster.teams:[];
    let firstChoice=null;
    if([req.home,req.away].every(id=>teams.some(team=>team.id===id))){
      for(const id of [req.home,req.away]){
        const team=teams.find(item=>item.id===id);
        const heading=document.createElement("h3");heading.textContent=team.name;sections.push(heading);
        const seen=new Set();
        const choices=(Array.isArray(team.choices)?team.choices:[]).filter(p=>typeof p?.name==="string"&&typeof p.id==="string"&&/^[1-9][0-9]{0,15}$/.test(p.id));
        choices.sort((a,b)=>a.name.localeCompare(b.name,lang));
        for(const choice of choices){
          if(seen.has(choice.id))continue;
          seen.add(choice.id);
          const option=document.createElement("button");option.type="button";
          option.textContent=(choice.number?"#"+choice.number+" · ":"")+choice.name;
          option.onclick=()=>{
            if(playerRequest!==req)return;
            if(selectPlayer(req.ticket,id,choice.id))closePlayers(true);
          };
          firstChoice??=option;sections.push(option);
        }
      }
    }
    if(!firstChoice){const info=document.createElement("p");info.textContent=playerText[1];sections.push(info);}
    playerMenu.replaceChildren(...sections,close);
    playerMenu.hidden=false;placePlayerMenu();
    if(focus&&!playerMenu.hidden)(firstChoice||close).focus({preventScroll:true});
  };
  window.addEventListener("message",event=>{
    if(event.origin!==location.origin||event.source!==scenePicker.contentWindow)return;
    const data=event.data;
    if(data?.type==="seh-presenter-lineup-save-result"&&lineupSaving){
      lineupSaving=false;lineupSaved=data.ok===true;
      lineupFeedback=lineupEditText[lineupSaved?5:6];
      if(!lineupSaved)lineupMessage("save-failed");
      renderLineupTools();return;
    }
    if(data?.type==="seh-presenter-player-result"){
      playerError.hidden=data.ok===true;playerError.textContent=playerError.hidden?"":playerText[3];return;
    }
    if(data?.type!=="seh-presenter-player-open"||!playerAnchor()||typeof data.ticket!=="string")return;
    if(!playerMenu.hidden){closePlayers(true);return;}
    playerError.hidden=true;
    playerRequest=data;buildPlayerMenu(true);
    postPlayer({type:"seh-presenter-player-expanded",expanded:!playerMenu.hidden});
  });
  document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!playerMenu.hidden){event.preventDefault();closePlayers(true);}});
  document.addEventListener("pointerdown",event=>{if(!playerMenu.contains(event.target))closePlayers();});
  window.addEventListener("scroll",()=>{if(!playerMenu.hidden)placePlayerMenu();},{passive:true});
  window.addEventListener("resize",()=>{if(!playerMenu.hidden)placePlayerMenu();});
  const lineupAccess=new MutationObserver(updateLineupButtons);
  scenePicker.addEventListener("load",()=>{
    closePlayers();
    lineupAccess.disconnect();
    const anchor=playerAnchor();
    if(anchor)lineupAccess.observe(anchor,{attributeFilter:["disabled"]});
    updateLineupButtons();
  });
  window.addEventListener("message",event=>{
    if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
    if(event.data?.type==="seh-presenter-lineup-reserves"){
      const {ticket,side,slot,team,current,choices}=event.data;
      if(!lineupEditing||lineupSaving||ticket!==playerRoster?.ticket||!["home","away"].includes(side)||!["LW","C","RW","LD","RD","G"].includes(slot)||!Array.isArray(choices))return;
      const available=[...new Map(choices.filter(p=>typeof p?.id==="string"&&/^[1-9][0-9]{0,15}$/.test(p.id)&&typeof p.name==="string").map(p=>[p.id,p])).values()].sort((a,b)=>a.name.localeCompare(b.name,lang));
      reserveTarget={ticket,side,slot};
      reserveLabel.textContent=[team,slot,current].filter(Boolean).join(" · ");
      reservePlayer.replaceChildren(new Option(lineupEditText[available.length?7:8],""),...available.map(p=>new Option((p.number?"#"+p.number+" · ":"")+p.name,p.id)));
      reservePicker.hidden=false;renderLineupTools();
      (available.length?reservePlayer:reserveClose).focus();
      return;
    }
    if(event.data?.type==="seh-presenter-lineup-edit-status"){
      lineupAvailable=event.data.available===true;lineupEditing=event.data.editing===true;lineupChanged=event.data.changed===true;
      if(event.data.choosing!==true)closeReserve();
      if(!lineupAvailable&&!lineupSaving)lineupFeedback="";
      if(!lineupEditing)lineupSaved=false;
      renderLineupTools();return;
    }
    if(event.data?.type==="seh-presenter-lineup-save"){
      if(lineupEditing&&!lineupSaving&&lineupChanged&&canSelectPlayer()&&event.data.ticket===playerRoster?.ticket){
        lineupSaving=true;lineupFeedback="";renderLineupTools();postPlayer(event.data);
      }else lineupMessage("save-failed");
      return;
    }
    if(event.data?.type==="seh-presenter-lineup-player"){
      const {ticket,team,id}=event.data;
      const roster=Array.isArray(playerRoster?.teams)?playerRoster.teams.find(entry=>entry.id===team):null;
      if(typeof ticket==="string"&&Array.isArray(roster?.choices)&&roster.choices.some(choice=>choice.id===id))selectPlayer(ticket,team,id);
      return;
    }
    if(event.data?.type!=="seh-presenter-lineups")return;
    const next=event.data.picker??null;
    if(JSON.stringify(next)!==JSON.stringify(playerRoster)){
      playerRoster=next;
      if(playerRequest)buildPlayerMenu(true);
    }
    const teams=event.data.lineups;
    if(teams===null){lineupStatus.hidden=false;lineupTeams.replaceChildren();return;}
    if(!Array.isArray(teams)||teams.length!==2||teams.some(team=>!["away","home"].includes(team?.side)||typeof team.name!=="string"||!team.players)||teams[0].side===teams[1].side)return;
    const sections=teams.map((team,i)=>{
      const section=document.createElement("section"),name=document.createElement("h3"),list=document.createElement("ul");
      section.className="presenter-lineup-team";name.textContent=team.name;
      const ticket=playerRoster?.ticket;
      const roster=Array.isArray(playerRoster?.teams)?playerRoster.teams.find(entry=>entry.id===team.id):null;
      for(const position of positions[i]){
        const player=team.players[position],cell=document.createElement("li"),meta=document.createElement("small"),gt=document.createElement("span");
        cell.dataset.position=position;
        meta.textContent=position+(player?.number?" · #"+player.number:"");
        gt.textContent=player?.gt||"–";
        if(typeof ticket==="string"&&player?.gt&&typeof player.id==="string"&&Array.isArray(roster?.choices)&&roster.choices.some(choice=>choice.id===player.id)){
          const button=document.createElement("button");
          button.type="button";button.disabled=!canSelectPlayer();
          button.title=playerAction(player.gt);button.setAttribute("aria-label",button.title);
          button.onclick=()=>{if(selectPlayer(ticket,team.id,player.id))closePlayers();};
          button.append(meta,gt);cell.append(button);
        }else cell.append(meta,gt);
        list.append(cell);
      }
      section.append(name,list);return section;
    });
    lineupTeams.replaceChildren(...sections);lineupStatus.hidden=true;
  });
  frame.src=path+"/?obs=1&viewer=1&presenter=1&v=20261111-champion-avatar";
  const originalTitles={sv:"Originalstream · utan ljud",en:"Original feed · muted",fi:"Alkuperäinen striimi · mykistetty",de:"Originalstream · stumm"};
  const original=document.getElementById("originalFeed");
  original.title=document.getElementById("originalFeedLabel").textContent=originalTitles[lang];
  original.src=path+"/?obs=1&viewer=1&feed=1&v=20261110-team-feeds";
  function mountControls(id,title,mode){
    const picker=document.getElementById(id);
    picker.title=title;
    let resize;
    picker.addEventListener("load",()=>{
      resize?.disconnect();
      const body=picker.contentDocument?.body;
      if(!body)return;
      const fit=()=>{
        const height=Math.ceil(body.getBoundingClientRect().height);
        picker.style.height=(mode==="stream"?(height?height+2:0):Math.max(26,height+2))+"px";
      };
      resize=new ResizeObserver(fit);
      resize.observe(body);
      fit();
    });
    picker.src="mobile.html?lang="+lang+"&compact="+mode+"&v=20261111-lineup-reserves";
  }
  mountControls("scenePicker",sceneTitle,"1");
  const seriesTitles={sv:"Serieläge",en:"Series score",fi:"Sarjatilanne",de:"Serienstand"};
  mountControls("seriesPicker",seriesTitles[lang],"series");
  const streamTitles={sv:"Byt matchstream",en:"Switch match feed",fi:"Vaihda ottelustriimi",de:"Spielstream wechseln"};
  mountControls("streamPicker",streamTitles[lang],"stream");
  const toolsLabels={
    sv:["Fler studioverktyg","Förbered matchen och styr sändningen. Kräver behörighet för SV-studion."],
    en:["More studio tools","Separate workspace for preparing matches and running the broadcast. Studio admin access required."],
    fi:["Lisää studiotyökaluja","Erillinen työtila ottelun valmisteluun ja lähetyksen ohjaukseen. Vaatii studion ylläpitäjän oikeudet."],
    de:["Weitere Studiowerkzeuge","Separater Arbeitsbereich für Spielvorbereitung und Sendungssteuerung. Studio-Adminrechte erforderlich."]
  };
  const [toolsTitle,toolsHint]=toolsLabels[lang];
  document.getElementById("studioToolsTitle").textContent=toolsTitle;
  const hint=document.getElementById("studioToolsHint");
  hint.textContent=toolsHint;
  if(lang==="sv"){
    const mobile=document.createElement("a");mobile.href="mobile.html?lang=sv";mobile.target="_blank";mobile.rel="noopener";
    mobile.textContent="Mobil scenväljare ↗";mobile.style.color="#ffdc77";
    hint.append(" · ",mobile);
  }
  const tools=document.getElementById("studioTools"),toolsFrame=document.getElementById("studioToolsFrame");
  toolsFrame.title=toolsTitle;
  let toolSize,toolStatus;
  toolsFrame.addEventListener("load",()=>{
    toolSize?.disconnect();toolStatus?.disconnect();
    const doc=toolsFrame.contentDocument;
    if(!doc?.body){toolsFrame.style.removeProperty("height");return;}
    const fit=()=>{
      if(!tools.open)return;
      const ready=doc.documentElement.hasAttribute("data-tools-ready")&&!doc.documentElement.hasAttribute("data-studio-locked");
      if(ready)toolsFrame.style.height=Math.ceil(doc.body.getBoundingClientRect().height+2)+"px";
      else toolsFrame.style.removeProperty("height");
    };
    toolSize=new ResizeObserver(fit);toolSize.observe(doc.body);
    toolStatus=new MutationObserver(fit);toolStatus.observe(doc.documentElement,{attributes:true,attributeFilter:["data-tools-ready","data-studio-locked"]});
    fit();
  });
  const loadTools=()=>{if(tools.open&&!toolsFrame.hasAttribute("src"))toolsFrame.src=path+"/?panel=tools&v=20261111-champion-avatar";};
  tools.addEventListener("toggle",loadTools);
  loadTools();
})();
</script>
