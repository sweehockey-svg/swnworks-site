<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Presentatörsvy · SWNWORKS</title>
  <link rel="stylesheet" href="commentator-notes.css?v=20261108-1">
  <style>
    body{margin:0;background:#06111a;color:#eef7ff;font:16px/1.5 Arial,sans-serif}
    main{margin:0;padding:4px clamp(10px,1.15vw,20px) 10px 6px}
    .commentator-workspace{gap:8px}
    .presenter-sidebar{display:grid;min-width:0;gap:6px}
    .presenter-sidebar #privateNotes textarea{min-height:150px;height:clamp(150px,31vh,340px)}
    #broadcast{width:100%;aspect-ratio:16/9;border:1px solid #345166;border-radius:10px;background:#000;display:block}
    #scenePicker,#seriesPicker{display:block;width:100%;height:32px;border:0}
    #scenePicker{margin-top:5px}
    .original-feed{width:min(100%,210px);margin:0;min-width:0}
    .original-feed figcaption{margin:0 0 3px;color:#aac1d0;font-size:11px;font-weight:800}
    #originalFeed{box-sizing:border-box;display:block;width:100%;aspect-ratio:16/9;border:1px solid #345166;border-radius:6px;background:#030b12}
    @media(min-width:880px){
      .commentator-workspace:has(.presenter-sidebar>#privateNotes[open]:not([hidden])){
        --notes-width:clamp(245px,22vw,410px);
        grid-template-columns:minmax(0,min(calc(100% - var(--notes-width) - 8px),var(--match-width,100%))) minmax(var(--notes-width),1fr);
      }
    }
    @media(min-width:880px) and (min-height:500px){
      .commentator-workspace{--match-width:calc((100svh - 72px)*16 / 9)}
      #broadcast,#scenePicker{width:min(100%,var(--match-width))}
    }
  </style>
</head>
<body data-commentary-role="obs-presenter">
<main>
  <div class="commentator-workspace">
    <section class="commentator-match">
      <iframe id="broadcast" title="Matchbild från studion" allow="fullscreen" allowfullscreen></iframe>
      <iframe id="scenePicker" title="Scenval" loading="lazy"></iframe>
    </section>
    <aside class="presenter-sidebar">
    <details id="privateNotes" open hidden>
      <summary>Egna anteckningar</summary>
      <p class="notes-hint" id="privateNotesHint"></p>
      <textarea maxlength="12000" autocomplete="off" spellcheck="false" aria-describedby="privateNotesHint"></textarea>
      <p class="notes-status" role="status"></p>
    </details>
    <iframe id="seriesPicker" title="Serieläge" loading="lazy"></iframe>
    <figure class="original-feed">
      <figcaption id="originalFeedLabel">Originalstream · utan ljud</figcaption>
      <iframe id="originalFeed" title="Originalstream" loading="lazy" allow="autoplay"></iframe>
    </figure>
    </aside>
  </div>
</main>
<script>
(() => {
  const labels={
    sv:["Presentatörsvy","Matchbild från studion","SV","Scenval"],
    en:["Presenter view","Match feed from the studio","en","Scene controls"],
    fi:["Esittäjänäkymä","Ottelukuva studiosta","fi","Näkymän valinta"],
    de:["Moderationsansicht","Spielbild aus dem Studio","de","Szenensteuerung"]
  };
  const requested=new URLSearchParams(location.search).get("lang")?.toLowerCase();
  const lang=Object.hasOwn(labels,requested)?requested:"sv";
  const [heading,title,path,sceneTitle]=labels[lang];
  document.documentElement.lang=lang;
  document.title=heading+" · SWNWORKS";
  const frame=document.getElementById("broadcast");
  frame.title=title;
  frame.src=path+"/?obs=1&viewer=1";
  const originalTitles={sv:"Originalstream · utan ljud",en:"Original feed · muted",fi:"Alkuperäinen striimi · mykistetty",de:"Originalstream · stumm"};
  const original=document.getElementById("originalFeed");
  original.title=document.getElementById("originalFeedLabel").textContent=originalTitles[lang];
  original.src=path+"/?obs=1&viewer=1&feed=1&v=20261108-raw-feed";
  function mountControls(id,title,mode){
    const picker=document.getElementById(id);
    picker.title=title;
    let resize;
    picker.addEventListener("load",()=>{
      resize?.disconnect();
      const body=picker.contentDocument?.body;
      if(!body)return;
      const fit=()=>{picker.style.height=Math.max(26,Math.ceil(body.getBoundingClientRect().height)+2)+"px";};
      resize=new ResizeObserver(fit);
      resize.observe(body);
      fit();
    });
    picker.src="mobile.html?lang="+lang+"&compact="+mode+"&v=20261108-short-series";
  }
  mountControls("scenePicker",sceneTitle,"1");
  const seriesTitles={sv:"Serieläge",en:"Series score",fi:"Sarjatilanne",de:"Serienstand"};
  mountControls("seriesPicker",seriesTitles[lang],"series");
})();
</script>
<script src="commentator-notes.js?v=20261108-2"></script>
</body>
</html>
