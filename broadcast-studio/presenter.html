<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Presentatörsvy · SWNWORKS</title>
  <link rel="stylesheet" href="commentator-notes.css?v=20261108-1">
  <style>
    body{margin:0;background:#06111a;color:#eef7ff;font:16px/1.5 Arial,sans-serif}
    main{max-width:1100px;margin:auto;padding:clamp(12px,2.5vw,26px)}
    h1{margin:0;font-size:clamp(22px,3vw,32px)}
    .intro{margin:6px 0 20px;color:#aac1d0}
    #broadcast{width:100%;aspect-ratio:16/9;border:1px solid #345166;border-radius:10px;background:#000;display:block}
  </style>
</head>
<body data-commentary-role="obs-presenter">
<main>
  <h1 id="presenterTitle">Presentatörsvy</h1>
  <p class="intro" id="presenterIntro">Öppna den här sidan i din vanliga webbläsare. Behåll din separata källa i OBS och fånga inte det här fönstret i sändningen.</p>
  <div class="commentator-workspace">
    <section class="commentator-match">
      <iframe id="broadcast" title="Matchbild från studion" allow="fullscreen" allowfullscreen></iframe>
    </section>
    <details id="privateNotes" open hidden>
      <summary>Egna anteckningar</summary>
      <p class="notes-hint" id="privateNotesHint"></p>
      <textarea maxlength="12000" autocomplete="off" spellcheck="false" aria-describedby="privateNotesHint"></textarea>
      <p class="notes-status" role="status"></p>
    </details>
  </div>
</main>
<script>
(() => {
  const labels={
    sv:["Presentatörsvy","Öppna den här sidan i din vanliga webbläsare. Behåll din separata källa i OBS och fånga inte det här fönstret i sändningen.","Matchbild från studion","SV"],
    en:["Presenter view","Open this page in your regular browser. Keep your separate OBS source and do not capture this window in the broadcast.","Match feed from the studio","en"],
    fi:["Esittäjänäkymä","Avaa tämä sivu tavallisessa selaimessa. Säilytä erillinen OBS-lähde äläkä kaappaa tätä ikkunaa lähetykseen.","Ottelukuva studiosta","fi"],
    de:["Moderationsansicht","Öffne diese Seite im normalen Browser. Behalte die separate OBS-Quelle und erfasse dieses Fenster nicht in der Sendung.","Spielbild aus dem Studio","de"]
  };
  const requested=new URLSearchParams(location.search).get("lang")?.toLowerCase();
  const lang=Object.hasOwn(labels,requested)?requested:"sv";
  const [heading,intro,title,path]=labels[lang];
  document.documentElement.lang=lang;
  document.title=heading+" · SWNWORKS";
  document.getElementById("presenterTitle").textContent=heading;
  document.getElementById("presenterIntro").textContent=intro;
  const frame=document.getElementById("broadcast");
  frame.title=title;
  frame.src=path+"/?obs=1&viewer=1";
})();
</script>
<script src="commentator-notes.js?v=20261108-2"></script>
</body>
</html>
