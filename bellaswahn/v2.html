<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NextGame</title>

  <style>
    :root{
      --bg:#0b0f19;
      --card:#111827;
      --card2:#161f30;
      --line:#273247;
      --text:#f8fafc;
      --muted:#8b96a8;
      --accent:#ff7417;
      --accent2:#ff9653;
      --green:#2bd49b;
      --yellow:#f4c84d;
      --red:#ff5f67;
      --radius:20px;
    }

    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      overscroll-behavior-y:none;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}

    .app{
      width:100%;
      max-width:540px;
      min-height:100vh;
      margin:0 auto;
      background:var(--bg);
    }

    .header{
      position:sticky;
      top:0;
      z-index:30;
      padding:
        calc(14px + env(safe-area-inset-top))
        16px
        14px;
      background:rgba(11,15,25,.94);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(39,50,71,.7);
    }

    .top-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
      flex:1 1 auto;
    }
    .brand-icon{
      width:50px;height:50px;
      flex:0 0 50px;
      display:grid;place-items:center;
      border-radius:16px;
      background:linear-gradient(180deg,#111b29,#0d1622);
      border:1px solid #263348;
      box-shadow:0 10px 26px rgba(0,0,0,.26);
      overflow:hidden;
    }
    .brand-icon svg{width:42px;height:42px}
    .brand-title{
      display:flex;
      align-items:baseline;
      flex:1 1 auto;
      font-weight:950;
      font-style:italic;
      letter-spacing:-.065em;
      font-size:clamp(34px,9.8vw,44px);
      line-height:.95;
      white-space:nowrap;
    }
    .brand-title-next{color:#f7f9fc}
    .brand-title-game{color:var(--accent)}

    .top-actions{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .status-badge{
      display:none;
      align-items:center;
      gap:6px;
      min-height:38px;
      padding:0 11px;
      border-radius:12px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.025em;
      white-space:nowrap;
      border:1px solid rgba(139,150,168,.2);
      color:#b8c1cf;
      background:#121a28;
    }
    .status-dot{width:8px;height:8px;border-radius:50%;background:#778398}
    .status-badge.live{
      color:#37dca6;
      background:rgba(4,78,58,.35);
      border-color:rgba(43,212,155,.25);
    }
    .status-badge.live .status-dot{background:var(--green);box-shadow:0 0 12px rgba(43,212,155,.5)}
    .status-badge.demo{
      color:#e1b948;
      background:rgba(92,72,12,.25);
      border-color:rgba(244,200,77,.22);
    }
    .status-badge.demo .status-dot{background:var(--yellow)}

    .icon-btn{
      width:44px;height:44px;
      display:grid;place-items:center;
      color:#dce3ec;
      background:#182235;
      border:1px solid var(--line);
      border-radius:14px;
    }
    .icon-btn:active{transform:scale(.97)}
    .icon-btn svg{width:21px;height:21px}

    .search{
      display:none;
      position:relative;
      margin-top:16px;
    }
    .search.open{display:block}
    .search svg{
      position:absolute;
      left:15px;top:50%;
      width:21px;height:21px;
      transform:translateY(-50%);
      color:#768397;
      pointer-events:none;
    }
    .search input{
      width:100%;
      height:52px;
      padding:0 15px 0 48px;
      color:white;
      background:#111827;
      border:1px solid #2a364b;
      border-radius:16px;
      outline:none;
      font-size:15px;
    }
    .search input::placeholder{color:#737f91}
    .search input:focus{
      border-color:#48566e;
      box-shadow:0 0 0 3px rgba(255,116,23,.06);
    }

    .tabs{
      display:flex;
      gap:9px;
      margin-top:14px;
      overflow-x:auto;
      scrollbar-width:none;
      padding-bottom:1px;
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab{
      flex:0 0 auto;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid #293449;
      color:#b9c2cf;
      background:#172132;
      font-size:13px;
      font-weight:800;
    }
    .tab.active{
      color:white;
      background:linear-gradient(180deg,#ff7c22,#ff6d0d);
      border-color:rgba(255,116,23,.72);
      box-shadow:0 7px 18px rgba(255,116,23,.16);
    }

    .content{
      padding:25px 16px calc(34px + env(safe-area-inset-bottom));
    }

    .date-section{margin-bottom:32px}
    .date-title{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0 0 14px;
      color:#a8b1bf;
      font-size:13px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .today-chip{
      padding:5px 9px;
      color:#fff;
      background:var(--accent);
      border-radius:8px;
      font-size:10px;
      letter-spacing:.03em;
    }

    .cards{display:grid;gap:13px}
    .match-card{
      padding:18px;
      background:linear-gradient(180deg,#121927,#101722);
      border:1px solid #273247;
      border-radius:20px;
      box-shadow:0 11px 30px rgba(0,0,0,.15);
    }
    .card-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:9px;
    }
    .league-chip,.time-chip,.state-chip{
      display:inline-flex;
      align-items:center;
      min-width:0;
      gap:7px;
      padding:7px 9px;
      border-radius:11px;
      border:1px solid #29364a;
      background:#111827;
      font-size:12px;
      font-weight:750;
    }
    .league-chip{
      max-width:72%;
      color:#aeb8c7;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .league-chip strong{color:#f1f4f8}
    .time-chip{
      color:var(--accent2);
      background:rgba(89,42,16,.30);
      border-color:rgba(255,116,23,.33);
      white-space:nowrap;
    }
    .state-chip.live{color:#35dda8;border-color:rgba(43,212,155,.3);background:rgba(6,71,55,.35)}
    .state-chip.final{color:#9ca7b8}
    .state-chip.cancelled{color:#ff858b;border-color:rgba(255,95,103,.28)}

    .race-title{
      margin-top:18px;
      font-size:21px;
      font-weight:900;
      letter-spacing:-.03em;
      line-height:1.25;
    }
    .race-sub{
      margin-top:5px;
      color:#8f9aae;
      font-size:12px;
      font-weight:750;
    }

    .teams{
      display:flex;
      flex-wrap:wrap;
      align-items:baseline;
      gap:7px;
      margin-top:17px;
      font-size:20px;
      font-weight:900;
      letter-spacing:-.03em;
      line-height:1.25;
    }
    .team-link{cursor:pointer}
    .vs{color:var(--accent);font-size:.83em;font-weight:650}
    .score{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:9px;
      font-size:24px;
      font-weight:950;
      letter-spacing:.02em;
    }
    .score-divider{color:#657187;font-weight:700}

    .footer{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      column-gap:10px;
      width:100%;
      margin-top:17px;
      padding-top:13px;
      border-top:1px solid rgba(39,50,71,.68);
    }
    .channel{
      display:flex;
      align-items:center;
      gap:7px;
      min-width:0;
      color:#9aa5b5;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
    }
    .channel span{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .channel svg{width:17px;height:17px;flex:0 0 17px;color:var(--accent)}
    .actions{
      display:flex;
      align-items:center;
      gap:7px;
      flex:0 0 auto;
      flex-wrap:nowrap;
      white-space:nowrap;
    }
    .btn{
      min-height:39px;
      padding:0 11px;
      border:1px solid #2c384b;
      border-radius:11px;
      background:#1b2638;
      color:#dbe2eb;
      font-size:12px;
      font-weight:850;
    }
    .btn.following{
      color:#ff9c5d;
      background:rgba(255,116,23,.12);
      border-color:rgba(255,116,23,.32);
    }

    .empty{
      padding:52px 18px;
      color:#7e899b;
      text-align:center;
      border:1px dashed #283448;
      border-radius:18px;
      font-size:14px;
    }

    .search-results{
      padding:0 16px;
      background:var(--bg);
    }
    .search-title{
      margin:18px 0 8px;
      color:#8b96a8;
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .result{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:9px;
      padding:13px 14px;
      border:1px solid #273247;
      border-radius:15px;
      background:#111827;
    }
    .result-main{min-width:0}
    .result-name{
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      font-size:14px;
      font-weight:900;
    }
    .result-sub{margin-top:3px;color:#8995a7;font-size:12px}
    .result-kind{color:#ff9550;font-size:10px;font-weight:950;letter-spacing:.04em}

    .detail-head{margin-bottom:16px}
    .back{
      padding:0;
      margin:0 0 12px;
      color:#9ba6b6;
      border:0;
      background:none;
      font-size:13px;
      font-weight:800;
    }
    .profile{
      padding:18px;
      border:1px solid #273247;
      border-radius:20px;
      background:linear-gradient(180deg,#131c2b,#111827);
    }
    .profile-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }
    .profile-icon{font-size:24px}
    .profile h2{
      margin:8px 0 5px;
      font-size:23px;
      letter-spacing:-.03em;
    }
    .profile p{margin:0;color:#8f9aae;font-size:12px;line-height:1.5}

    .filter-sheet{
      position:fixed;
      inset:0;
      z-index:50;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      background:rgba(0,0,0,.55);
      padding:14px;
    }
    .filter-panel{
      width:100%;
      max-width:520px;
      max-height:78vh;
      overflow:auto;
      padding:18px;
      padding-bottom:calc(18px + env(safe-area-inset-bottom));
      border:1px solid #2b374c;
      border-radius:24px;
      background:#111827;
      box-shadow:0 -12px 50px rgba(0,0,0,.35);
    }
    .sheet-handle{
      width:46px;height:4px;
      margin:0 auto 16px;
      border-radius:99px;
      background:#3c485a;
    }
    .sheet-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }
    .sheet-title h3{margin:0;font-size:18px}
    .close-btn{
      width:36px;height:36px;
      border:1px solid #2d394d;
      border-radius:11px;
      background:#172132;
      color:#cbd4df;
    }
    .filter-label{
      margin:17px 0 8px;
      color:#8f9aac;
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .filter-grid{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .filter-option{
      padding:9px 11px;
      border:1px solid #2b374a;
      border-radius:12px;
      background:#172132;
      color:#c1cad7;
      font-size:12px;
      font-weight:800;
    }
    .filter-option.on{
      border-color:rgba(255,116,23,.42);
      background:rgba(255,116,23,.13);
      color:#ff9a5a;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(20px + env(safe-area-inset-bottom));
      z-index:80;
      transform:translateX(-50%);
      max-width:calc(100vw - 30px);
      padding:11px 14px;
      border:1px solid #33415a;
      border-radius:13px;
      background:#182235;
      color:white;
      box-shadow:0 12px 35px rgba(0,0,0,.38);
      font-size:12px;
      font-weight:800;
      text-align:center;
    }

    @media(max-width:390px){
      .brand-title{font-size:20px}
      .status-badge{display:none}
      .header{padding-left:13px;padding-right:13px}
      .content{padding-left:13px;padding-right:13px}
      .search-results{padding-left:13px;padding-right:13px}
      .match-card{padding:14px}
      .teams{font-size:18px}
      .footer{
        grid-template-columns:minmax(0,1fr) auto;
        column-gap:7px;
      }
      .channel{
        font-size:11px;
        gap:5px;
      }
      .channel svg{
        width:15px;
        height:15px;
        flex-basis:15px;
      }
      .actions{gap:5px}
      .btn{
        min-height:36px;
        padding:0 8px;
        font-size:11px;
      }
    }

    @media(max-width:355px){
      .footer{column-gap:5px}
      .channel{font-size:10px}
      .btn{
        padding:0 7px;
        font-size:10px;
      }
    }
  </style>
</head>

<body>
<div class="app">
  <header class="header">
    <div class="top-row">
      <div class="brand" onclick="goHome()" role="button" tabindex="0">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M10 14.5C10 11.5 12.4 9 15.5 9h17C35.6 9 38 11.5 38 14.5v16.2c0 4.6-3.7 8.3-8.3 8.3H15.5C12.4 39 10 36.5 10 33.5v-19Z" stroke="#F7F9FC" stroke-width="3.2"/>
            <path d="M16 6v7M32 6v7" stroke="#F7F9FC" stroke-width="3.2" stroke-linecap="round"/>
            <rect x="15" y="18" width="5" height="5" rx="1.2" fill="#AAB3C0"/>
            <rect x="22" y="18" width="5" height="5" rx="1.2" fill="#AAB3C0"/>
            <rect x="29" y="18" width="5" height="5" rx="1.2" fill="#FF7417"/>
            <rect x="15" y="25" width="5" height="5" rx="1.2" fill="#AAB3C0"/>
            <rect x="22" y="25" width="5" height="5" rx="1.2" fill="#AAB3C0"/>
            <path d="M28.5 39H38V29.5c-2.2 5.6-4.6 7.8-9.5 9.5Z" fill="#111B29"/>
            <text x="26.5" y="39.5" fill="#FF7417" font-size="10" font-weight="900" font-style="italic">NG</text>
          </svg>
        </div>
        <div class="brand-title"><span class="brand-title-next">Next</span><span class="brand-title-game">Game</span></div>
      </div>

      <div class="top-actions">
        <div id="apiStatus" class="status-badge demo" title="Datakälla">
          <span class="status-dot"></span>
          <span id="apiStatusText">DEMO DATA</span>
        </div>

        <button id="searchToggleButton" class="icon-btn" onclick="toggleSearch()" aria-label="Sök" title="Sök">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.2-3.2"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="searchBar" class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.2-3.2"/>
      </svg>
      <input id="searchInput" type="search" placeholder="Sök lag, liga eller sport..." autocomplete="off" />
    </div>

    <div id="tabs" class="tabs">
      <button class="tab active" data-tab="Alla">Alla</button>
      <button class="tab" data-tab="Favoriter">⭐ Favoriter</button>
      <button class="tab" data-tab="Fotboll">⚽ Fotboll</button>
      <button class="tab" data-tab="NHL">🏒 NHL</button>
      <button class="tab" data-tab="NBA">🏀 NBA</button>
      <button class="tab" data-tab="NFL">🏈 NFL</button>
      <button class="tab" data-tab="F1">🏎️ F1</button>
    </div>
  </header>

  <div id="searchResults" class="search-results hidden"></div>
  <main id="appContent" class="content"></main>
</div>

<div id="filterSheet" class="filter-sheet hidden" onclick="backdropClose(event)">
  <div class="filter-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <h3>Filter</h3>
      <button class="close-btn" onclick="closeFilters()" aria-label="Stäng">✕</button>
    </div>

    <div class="filter-label">Sport</div>
    <div class="filter-grid" id="sportFilters"></div>

    <div class="filter-label">Ligor</div>
    <div class="filter-grid" id="leagueFilters"></div>

    <div class="filter-label">Visning</div>
    <div class="filter-grid">
      <button id="followedOnlyButton" class="filter-option" onclick="toggleFollowedOnly()">Bara favoriter</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/*
  NEXTGAME – MOBIL V5.1

  API:
  Den här versionen hämtar matcher direkt från ESPN:s öppna scoreboard-endpoints.
  Ingen API-nyckel krävs. ESPN-endpointen är dock inte en officiell publik utvecklarprodukt,
  så demo-data finns kvar som fallback om deras format eller åtkomst ändras.

  Godkänt svar:
  1) { leagues: [...] }
  2) [...]

  League:
  {
    id: "pl",
    name: "Premier League",
    sport: "Fotboll",
    matches: [...]
  }

  Match:
  {
    id: "123",
    home: "Arsenal",
    away: "Chelsea",
    startTime: "2026-10-24T18:30:00+02:00",
    channel: "Viaplay",
    status: "scheduled" | "live" | "final" | "cancelled",
    homeScore: null,
    awayScore: null
  }
*/

const ESPN_SOURCES = [
  {
    id: "pl",
    name: "Premier League",
    sport: "Fotboll",
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"
  },
  {
    id: "championship",
    name: "Championship",
    sport: "Fotboll",
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.2/scoreboard"
  },
  {
    id: "allsvenskan",
    name: "Allsvenskan",
    sport: "Fotboll",
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/swe.1/scoreboard"
  },
  {
    id: "serie-a",
    name: "Serie A",
    sport: "Fotboll",
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard"
  },
  {
    id: "bundesliga",
    name: "Bundesliga",
    sport: "Fotboll",
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/scoreboard"
  },
  {
    id: "la-liga",
    name: "La Liga",
    sport: "Fotboll",
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard"
  },
  {
    id: "ucl",
    name: "Champions League",
    sport: "Fotboll",
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard"
  },
  {
    id: "nhl",
    name: "NHL",
    sport: "Ishockey",
    url: "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard"
  },
  {
    id: "nfl",
    name: "NFL",
    sport: "Amerikansk fotboll",
    url: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
  },
  {
    id: "nba",
    name: "NBA",
    sport: "Basket",
    url: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"
  },
  {
    id: "f1",
    name: "Formel 1",
    sport: "Motorsport",
    kind: "race",
    url: "https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard"
  }
];

const API_CONFIG = {
  daysBack: 1,
  daysAhead: 30,
  soccerDaysAhead: 14,
  teamSportsFallbackDaysAhead: 7,
  timeoutMs: 9000,
  cacheMs: 5 * 60 * 1000
};

const DEMO_DATA = [
  {
    id: "pl",

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function safeJs(value) {

}

function normalizeLeague(league) {
  const name = String(league.name || league.league || "Okänd liga");
  const sport = String(league.sport || "Sport");
  const matches = Array.isArray(league.matches) ? league.matches : [];

  return {
    id: String(league.id || name.toLowerCase().replace(/\s+/g,"-")),
    name,
    sport,
    matches: matches.map((m, index) => ({
      id: m.id ?? `${name}-${index}`,
      home: String(m.home || m.homeTeam || "Hemmalag"),
      away: String(m.away || m.awayTeam || "Bortalag"),
      startTime: String(m.startTime || m.dateTime || m.date || new Date().toISOString()),
      channel: String(m.channel || m.tv || m.broadcaster || "TV-info saknas"),
      status: String(m.status || "scheduled").toLowerCase(),
      homeScore: m.homeScore ?? null,
      awayScore: m.awayScore ?? null,
      kind: String(m.kind || "game"),
      eventTitle: String(m.eventTitle || ""),
      session: String(m.session || "")
    }))
  };
}

function rebuildTeams() {
  const map = {};

  // Teams that occur in the loaded fixture window.
  leaguesData.forEach(league => {
    league.matches.forEach(match => {
      if (match.kind === "race") return;

      [match.home, match.away].filter(Boolean).forEach(teamName => {
        const key = teamName.toLowerCase();

        if (!map[key]) {
          map[key] = {
            name: teamName,
            sport: league.sport,
            leagues: new Set(),
            matches: [],
            catalogEntries: []
          };
        }

        map[key].leagues.add(league.name);
        map[key].matches.push({
          ...match,
          league: league.name,
          sport: league.sport
        });
      });
    });
  });

  // Also include every team returned by the league team endpoints.
  // This makes search useful even when a team has no game in the loaded date window.
  teamCatalog.forEach(entry => {
    const key = entry.name.toLowerCase();

    if (!map[key]) {
      map[key] = {
        name: entry.name,
        sport: entry.sport,
        leagues: new Set(),
        matches: [],
        catalogEntries: []
      };
    }

    if (!Array.isArray(map[key].catalogEntries)) map[key].catalogEntries = [];
    if (!map[key].catalogEntries.some(item => item.id === entry.id && item.sourceId === entry.sourceId)) {
      map[key].catalogEntries.push(entry);
    }
    map[key].leagues.add(entry.league);
  });

  teamsData = Object.values(map).map(team => ({
    ...team,
    leagues: Array.from(team.leagues)
  }));
}

async function fetchWithTimeout(url, options = {}, timeoutMs = 9000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);

  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

function ymd(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}${m}${d}`;
}

function apiDateRange() {
  const start = new Date();
  start.setDate(start.getDate() - API_CONFIG.daysBack);

  const end = new Date();
  end.setDate(end.getDate() + API_CONFIG.daysAhead);

  return `${ymd(start)}-${ymd(end)}`;
}

function espnScoreValue(value) {
  if (value === null || value === undefined || value === "") return null;
  if (typeof value === "object") {
    if (value.displayValue !== undefined) return value.displayValue;
    if (value.value !== undefined) return value.value;
  }
  return String(value);
}

function espnStatus(event, competition) {
  const raw = competition?.status || event?.status || {};
  const type = raw.type || {};
  const name = String(type.name || type.description || "").toUpperCase();
  const state = String(type.state || "").toLowerCase();

  if (name.includes("POSTPON")) return "postponed";
  if (name.includes("CANCEL")) return "cancelled";
  if (type.completed || state === "post") return "final";
  if (state === "in") return "live";
  return "scheduled";
}

function espnChannel(competition) {
  const names = [];

  if (Array.isArray(competition?.broadcasts)) {
    competition.broadcasts.forEach(b => {
      if (Array.isArray(b.names)) names.push(...b.names);
    });
  }

  if (Array.isArray(competition?.geoBroadcasts)) {
    competition.geoBroadcasts.forEach(b => {
      const name =
        b?.media?.shortName ||
        b?.media?.name ||
        b?.type?.shortName ||
        b?.type?.name;
      if (name) names.push(name);
    });
  }

  const unique = [...new Set(names.filter(Boolean))];
  return unique.length ? unique.join(", ") : "TV-info saknas";
}

function parseEspnSource(source, payload) {
  const events = Array.isArray(payload?.events) ? payload.events : [];

  if (source.kind === "race") {
    const matches = events.flatMap(event => {
      const competitions = Array.isArray(event.competitions) ? event.competitions : [];

      const wanted = competitions.filter(comp => {
        const label = String(
          comp?.type?.text ||
          comp?.type?.name ||
          comp?.type?.abbreviation ||
          ""
        ).toUpperCase();

        if (/PRACTICE|PRACTICE SESSION|FP1|FP2|FP3|TRÄNING/.test(label)) return false;
        return /QUAL|QUALIFYING|SPRINT SHOOTOUT|SPRINT QUAL|SPRINT|RACE|GRAND PRIX/.test(label);
      });

      const sessions = wanted.length ? wanted : competitions.slice(-1);

      return sessions.map(comp => {
        const rawLabel = String(
          comp?.type?.text ||
          comp?.type?.name ||
          comp?.type?.abbreviation ||
          "Race"
        );
        const upper = rawLabel.toUpperCase();

        let session = "Lopp";
        if (/SPRINT.*QUAL|SPRINT SHOOTOUT/.test(upper)) session = "Sprintkval";
        else if (/QUAL/.test(upper)) session = "Kval";
        else if (/SPRINT/.test(upper) && !/QUAL/.test(upper)) session = "Sprint";
        else if (/RACE|GRAND PRIX/.test(upper)) session = "Lopp";

        return {
          id: String(`${event.id || "f1"}-${comp.id || session}-${comp.date || event.date || ""}`),
          home: "",
          away: "",
          kind: "race",
          eventTitle: String(event.shortName || event.name || "Formel 1"),
          session,
          startTime: String(comp.date || event.date || new Date().toISOString()),
          channel: espnChannel(comp),
          status: espnStatus(event, comp),
          homeScore: null,
          awayScore: null
        };
      });
    }).filter(Boolean);

    return {
      id: source.id,
      name: source.name,
      sport: source.sport,
      matches
    };
  }

  const matches = events.map(event => {
    const competition = Array.isArray(event.competitions) ? event.competitions[0] : null;
    if (!competition) return null;

    const competitors = Array.isArray(competition.competitors)
      ? competition.competitors
      : [];

    const home = competitors.find(c => c.homeAway === "home") || competitors[0];
    const away = competitors.find(c => c.homeAway === "away") || competitors[1];

    if (!home?.team || !away?.team) return null;

    const eventLeague =
      event?.league ||
      competition?.league ||
      event?.season?.league ||
      null;

    return {
      id: String(event.id || competition.id || `${source.id}-${event.date}`),
      home: String(home.team.displayName || home.team.shortDisplayName || home.team.name || "Hemmalag"),
      away: String(away.team.displayName || away.team.shortDisplayName || away.team.name || "Bortalag"),
      startTime: String(event.date || competition.date || new Date().toISOString()),
      channel: espnChannel(competition),
      status: espnStatus(event, competition),
      homeScore: espnScoreValue(home.score),
      awayScore: espnScoreValue(away.score),
      kind: "game",
      eventTitle: "",
      session: "",
      leagueName: String(eventLeague?.displayName || eventLeague?.name || eventLeague?.shortName || source.name),
      leagueSlug: String(eventLeague?.slug || eventLeague?.abbreviation || eventLeague?.id || "")
    };
  }).filter(Boolean);

  return {
    id: source.id,
    name: source.name,
    sport: source.sport,
    matches
  };
}

function parseEspnTeams(source, payload) {
  if (source.kind === "race") return [];

  const league =
    payload?.sports?.[0]?.leagues?.[0] ||
    payload?.leagues?.[0] ||
    null;

  const rows = Array.isArray(league?.teams) ? league.teams : [];

  return rows
    .map(row => row?.team || row)
    .filter(Boolean)
    .map(team => ({
      id: String(team.id || ""),
      name: String(team.displayName || team.shortDisplayName || team.name || "").trim(),
      sport: source.sport,
      league: source.name,
      sourceId: source.id
    }))
    .filter(team => team.name);
}

async function fetchEspnTeams(source) {
  if (source.kind === "race") return [];

  const teamsUrl = source.url.replace(/\/scoreboard(?:\?.*)?$/, "/teams");

  const response = await fetchWithTimeout(
    teamsUrl,
    { headers: { "Accept": "application/json" } },
    API_CONFIG.timeoutMs
  );

  if (!response.ok) {
    throw new Error(`${source.name} teams: HTTP ${response.status}`);
  }

  return parseEspnTeams(source, await response.json());
}

async function loadTeamCatalog() {
  const results = await Promise.allSettled(
    ESPN_SOURCES
      .filter(source => source.kind !== "race")
      .map(source => fetchEspnTeams(source))
  );

  const seen = new Set();
  const catalog = [];

  results.forEach(result => {
    if (result.status !== "fulfilled") return;

    result.value.forEach(team => {
      const key = `${team.name.toLowerCase()}|${team.league.toLowerCase()}`;
      if (seen.has(key)) return;
      seen.add(key);
      catalog.push(team);
    });
  });

  teamCatalog = catalog;
  console.info(`Sportkalendern team catalog: ${teamCatalog.length} lag`);
  rebuildTeams();

  const searchValue = document.getElementById("searchInput")?.value || "";
  if (searchValue.trim()) renderSearch(searchValue);
}

function readApiCache() {

function dateKeyWithOffset(offsetDays) {
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() + offsetDays);
  return ymd(d);
}

async function fetchEspnDay(source, dateKey) {
  const separator = source.url.includes("?") ? "&" : "?";
  const url = `${source.url}${separator}dates=${encodeURIComponent(dateKey)}`;

  const response = await fetchWithTimeout(
    url,
    { headers: { "Accept": "application/json" } },
    API_CONFIG.timeoutMs
  );

  if (!response.ok) {
    throw new Error(`${source.name} ${dateKey}: HTTP ${response.status}`);
  }

  return parseEspnSource(source, await response.json());
}

async function fetchEspnLeague(source, range) {
  const isSoccer = source.url.includes("/sports/soccer/");

  // ESPN ändrade beteendet för fotbollens date-range i september 2026.
  // Enskilda datum fungerar fortfarande, så fotboll hämtas dag för dag.
  if (isSoccer) {
    const matchesById = new Map();
    let successfulDays = 0;

    for (let offset = -API_CONFIG.daysBack; offset <= API_CONFIG.soccerDaysAhead; offset++) {
      try {
        const day = await fetchEspnDay(source, dateKeyWithOffset(offset));
        successfulDays++;
        day.matches.forEach(match => matchesById.set(String(match.id), match));
      } catch (error) {
        console.warn(`Kunde inte hämta ${source.name} dag ${offset}`, error);
      }
    }

    if (!successfulDays) {
      throw new Error(`${source.name}: inga datum kunde hämtas`);
    }

    return {
      id: source.id,
      name: source.name,
      sport: source.sport,
      matches: [...matchesById.values()].sort((a,b) => new Date(a.startTime) - new Date(b.startTime))
    };
  }

  const separator = source.url.includes("?") ? "&" : "?";
  const url = `${source.url}${separator}limit=1000&dates=${encodeURIComponent(range)}`;

  try {
    const response = await fetchWithTimeout(
      url,
      { headers: { "Accept": "application/json" } },
      API_CONFIG.timeoutMs
    );

    if (!response.ok) {
      throw new Error(`${source.name}: HTTP ${response.status}`);
    }

    const parsed = parseEspnSource(source, await response.json());

    // ESPN kan ibland svara 200 men ändå ge tom events-lista för ett datumintervall.
    // F1 fungerar bra som range, men NHL/NFL/NBA får en dag-för-dag fallback.
    if (parsed.matches.length || source.kind === "race") {
      return parsed;
    }
  } catch (error) {
    console.warn(`${source.name}: range-hämtningen misslyckades`, error);
    if (source.kind === "race") throw error;
  }

  const matchesById = new Map();
  let successfulDays = 0;

  for (let offset = -API_CONFIG.daysBack; offset <= API_CONFIG.teamSportsFallbackDaysAhead; offset++) {
    try {
      const day = await fetchEspnDay(source, dateKeyWithOffset(offset));
      successfulDays++;
      day.matches.forEach(match => matchesById.set(String(match.id), match));
    } catch (error) {
      console.warn(`Kunde inte hämta ${source.name} dag ${offset}`, error);
    }
  }

  if (!successfulDays) {
    throw new Error(`${source.name}: varken range eller dagsdata kunde hämtas`);
  }

  return {
    id: source.id,
    name: source.name,
    sport: source.sport,
    matches: [...matchesById.values()].sort((a,b) => new Date(a.startTime) - new Date(b.startTime))
  };
}

async function loadData() {
  const teamCatalogPromise = loadTeamCatalog().catch(error => {
    console.warn("Kunde inte ladda lagkatalogen.", error);
  });

  const cached = readApiCache();

  if (cached) {
    leaguesData = cached.map(normalizeLeague);
    rebuildTeams();
    setStatus("cache");
    renderEverything();
  }

  try {
    const range = apiDateRange();
    const results = await Promise.allSettled(
      ESPN_SOURCES.map(source => fetchEspnLeague(source, range))
    );

    const loaded = results
      .filter(result => result.status === "fulfilled")
      .map(result => result.value)
      .filter(league => Array.isArray(league.matches));

    const totalMatches = loaded.reduce((sum, league) => sum + league.matches.length, 0);

    if (!loaded.length || totalMatches === 0) {
      throw new Error("API svarade men gav inga matcher i valt datumintervall");
    }

    leaguesData = loaded.map(normalizeLeague);
    console.info("Sportkalendern API:", leaguesData.map(l => `${l.name}: ${l.matches.length}`).join(" | "));
    await teamCatalogPromise;
    rebuildTeams();
    saveApiCache(leaguesData);
    setStatus("live");
    renderEverything();

    const failed = results.filter(result => result.status === "rejected").length;
    if (failed) {
      showToast(`${failed} liga kunde inte laddas, resten är live`);
    }
  } catch (error) {
    console.warn("ESPN API kunde inte laddas.", error);

    if (!cached) {
      leaguesData = DEMO_DATA.map(normalizeLeague);
      await teamCatalogPromise;
      rebuildTeams();
      setStatus("demo");
      renderEverything();
      showToast("API kunde inte laddas – visar demo-data");
    }
  }
}

function swedishBroadcaster(match) {
  const raw = String(match.channel || "").trim();

  // Keep only recognisably Swedish/Nordic services if the event feed happens to contain one.
  const allowed = [
    /viaplay/i,
    /v sport/i,
    /tv6/i,
    /tv4/i,
    /disney/i,
    /prime video/i,
    /amazon prime/i,
    /dazn/i,
    /nba league pass/i,
    /hbo max/i,
    /kanal 9/i
  ];

  if (raw && allowed.some(pattern => pattern.test(raw))) {
    return raw;
  }

  return SWEDISH_BROADCASTERS[match.league] || "Svensk sändning ej bekräftad";
}

function downloadIcs(match) {
  const start = new Date(match.startTime);
  const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);

  const utc = d =>
    d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z$/,"Z");

  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//NextGame//SV",
    "BEGIN:VEVENT",
    `UID:sportkalendern-${match.id}@local`,
    `DTSTAMP:${utc(new Date())}`,
    `DTSTART:${utc(start)}`,
    `DTEND:${utc(end)}`,
    `SUMMARY:${match.kind === "race" ? match.eventTitle : `${match.home} vs ${match.away}`}`,
    `DESCRIPTION:${match.league || ""} • ${swedishBroadcaster(match)}`,
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], { type:"text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${match.home}-vs-${match.away}.ics`.replace(/[^\w\-\.]+/g,"-");
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("Kalenderfil skapad");
}

function futureOnly(matches) {
  const now = Date.now() - 6 * 60 * 60 * 1000;
  return matches
    .filter(match => {
      const ts = new Date(match.startTime).getTime();
      return Number.isFinite(ts) && ts >= now;
    })
    .sort((a,b) => new Date(a.startTime) - new Date(b.startTime));
}

function seasonYearForSource(source) {
  const now = new Date();
  const year = Number(new Intl.DateTimeFormat("en", {year:"numeric", timeZone:"Europe/Stockholm"}).format(now));
  const month = Number(new Intl.DateTimeFormat("en", {month:"numeric", timeZone:"Europe/Stockholm"}).format(now));

  if (source.id === "allsvenskan" || source.id === "nfl" || source.id === "f1") return year;
  if (source.sport === "Fotboll" || source.id === "nhl" || source.id === "nba") {
    return month >= 7 ? year + 1 : year;
  }
  return year;
}

async function fetchTeamSeasonEntry(entry, allSoccerCompetitions = false) {
  const source = currentSourceById(entry.sourceId);
  if (!source || source.kind === "race" || !entry.id) return [];

  const season = seasonYearForSource(source);
  const base = source.url.slice(0, source.url.lastIndexOf("/scoreboard"));

  const url = source.sport === "Fotboll" && allSoccerCompetitions
    ? `https://site.api.espn.com/apis/site/v2/sports/soccer/all/teams/${encodeURIComponent(entry.id)}/schedule?season=${season}&fixture=true&limit=500`
    : `${base}/teams/${encodeURIComponent(entry.id)}/schedule?season=${season}&fixture=true&limit=500&eventsforward=150`;

  const response = await fetchWithTimeout(url, {headers:{"Accept":"application/json"}}, API_CONFIG.timeoutMs);
  if (!response.ok) throw new Error(`${entry.name} / ${entry.league}: HTTP ${response.status}`);

  const parsed = parseEspnSource(source, await response.json());
  return parsed.matches.map(match => ({
    ...match,
    league: match.leagueName || source.name,
    sport: source.sport
  }));
}

async function loadTeamSeason(name) {
  if (teamSeasonCache.has(name) || seasonLoading.has(`team:${name}`)) return;

  const entries = teamCatalog.filter(entry => entry.name === name);
  if (!entries.length) return;

  const uniqueEntries = [];
  const seen = new Set();

  entries.forEach(entry => {
    const source = currentSourceById(entry.sourceId);
    const key = source?.sport === "Fotboll" ? `soccer:${entry.id}` : `${entry.sourceId}:${entry.id}`;
    if (!seen.has(key)) {
      seen.add(key);
      uniqueEntries.push(entry);
    }
  });

  seasonLoading.add(`team:${name}`);
  renderMain();

  try {
    const results = await Promise.allSettled(uniqueEntries.map(entry => {
      const source = currentSourceById(entry.sourceId);
      return fetchTeamSeasonEntry(entry, source?.sport === "Fotboll");
    }));

    const byId = new Map();
    results.forEach(result => {
      if (result.status !== "fulfilled") return;
      result.value.forEach(match => byId.set(String(match.id), match));
    });

    const fullSchedule = futureOnly([...byId.values()]);
    console.info(`NextGame season schedule ${name}: ${fullSchedule.length} upcoming events`);
    teamSeasonCache.set(name, fullSchedule);
  } catch (error) {
    console.warn("Kunde inte ladda lagets säsongsschema.", error);
    teamSeasonCache.set(name, []);
  } finally {
    seasonLoading.delete(`team:${name}`);
    if (currentView.view === "team" && currentView.name === name) renderMain();
  }
}

async function fetchF1Season() {
  const source = ESPN_SOURCES.find(item => item.id === "f1");
  if (!source) return [];

  const year = new Date().getFullYear();
  const url = `${source.url}?limit=1000&dates=${year}`;
  const response = await fetchWithTimeout(
    url,
    { headers: { "Accept": "application/json" } },
    API_CONFIG.timeoutMs
  );

  if (!response.ok) throw new Error(`Formel 1: HTTP ${response.status}`);
  const parsed = parseEspnSource(source, await response.json());

  return futureOnly(parsed.matches.map(match => ({
    ...match,
    league: source.name,
    sport: source.sport
  })));
}

async function loadLeagueSeason(name) {
  if (leagueSeasonCache.has(name) || seasonLoading.has(`league:${name}`)) return;

  const source = ESPN_SOURCES.find(item => item.name === name);
  if (!source) return;

  seasonLoading.add(`league:${name}`);
  renderMain();

  try {
    if (source.kind === "race") {
      leagueSeasonCache.set(name, await fetchF1Season());
    } else {
      const entries = teamCatalog.filter(entry => entry.league === name);
      const results = await Promise.allSettled(entries.map(entry => fetchTeamSeasonEntry(entry, false)));
      const byId = new Map();

      results.forEach(result => {
        if (result.status !== "fulfilled") return;
        result.value.forEach(match => byId.set(String(match.id), match));
      });

      leagueSeasonCache.set(name, futureOnly([...byId.values()]));
    }
  } catch (error) {
    console.warn("Kunde inte ladda ligans säsongsschema.", error);
    leagueSeasonCache.set(name, []);
  } finally {
    seasonLoading.delete(`league:${name}`);
    if (currentView.view === "league" && currentView.name === name) renderMain();
  }
}

function openLeaguePage(name) {
  currentView = { view:"league", name };
  clearSearch();
  window.scrollTo({ top:0, behavior:"smooth" });
  renderEverything();
  loadLeagueSeason(name);
}

function openTeamPage(name) {
  currentView = { view:"team", name };
  clearSearch();
  window.scrollTo({ top:0, behavior:"smooth" });
  renderEverything();
  loadTeamSeason(name);
}

function goHome() {
  currentView = { view:"home" };
  window.scrollTo({ top:0, behavior:"smooth" });
  renderEverything();
}

function toggleSearch() {
  const bar = document.getElementById("searchBar");
  const input = document.getElementById("searchInput");
  const opening = !bar.classList.contains("open");

  if (opening) {
    bar.classList.add("open");
    requestAnimationFrame(() => input.focus());
  } else {
    clearSearch();
  }
}

function clearSearch() {
  document.getElementById("searchInput").value = "";
  document.getElementById("searchResults").classList.add("hidden");
  document.getElementById("searchResults").innerHTML = "";
  document.getElementById("searchBar").classList.remove("open");
}

function setTab(tab) {
  activeTab = tab;
  currentView = { view:"home" };

  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === tab);
  });

  renderEverything();
}

function allMatches() {
  return leaguesData
    .flatMap(league => league.matches.map(match => ({
      ...match,
      league:league.name,
      sport:league.sport
    })))
    .sort((a,b) => new Date(a.startTime) - new Date(b.startTime));
}

function filterMatches(matches) {
  let filtered = matches;

  if (activeTab === "Favoriter") {
    filtered = filtered.filter(match =>
      followedItems.includes(match.league) ||
      followedItems.includes(match.home) ||
      followedItems.includes(match.away)
    );
  } else if (activeTab === "Fotboll") {
    filtered = filtered.filter(match => match.sport === "Fotboll");
  } else if (activeTab === "NHL") {
    filtered = filtered.filter(match => match.league === "NHL");
  } else if (activeTab === "NBA") {
    filtered = filtered.filter(match => match.league === "NBA");
  } else if (activeTab === "NFL") {
    filtered = filtered.filter(match => match.league === "NFL");
  } else if (activeTab === "F1") {
    filtered = filtered.filter(match => match.league === "Formel 1");
  }

  if (selectedSports.size) {
    filtered = filtered.filter(match => selectedSports.has(match.sport));
  }

  if (selectedLeagues.size) {
    filtered = filtered.filter(match => selectedLeagues.has(match.league));
  }

  if (followedOnly) {
    filtered = filtered.filter(match =>
      followedItems.includes(match.league) ||
      followedItems.includes(match.home) ||
      followedItems.includes(match.away)
    );
  }

  return filtered;
}

function matchCard(match, followTarget) {
  const isRace = match.kind === "race";
  const actualFollowTarget = isRace ? match.league : followTarget;
  const followed = followedItems.includes(actualFollowTarget);
  const broadcaster = swedishBroadcaster(match);

  return `
    <article class="match-card">
      <div class="card-top">
        <div class="league-chip" onclick='openLeaguePage(${safeJs(match.league)})'>
          <span>${sportIcon(match.sport)}</span>
          <span>${escapeHtml(match.sport)} <span style="color:#4e5b70">•</span> <strong>${escapeHtml(match.league)}</strong></span>
        </div>
        ${formatStatus(match)}
      </div>

      ${isRace ? `
        <div class="race-title">${escapeHtml(match.eventTitle || "Formel 1")}</div>
        <div class="race-sub">${escapeHtml(match.session || "Race")}</div>
      ` : `
        <div class="teams">
          <span class="team-link" onclick='openTeamPage(${safeJs(match.home)})'>${escapeHtml(match.home)}</span>
          <span class="vs">vs</span>
          <span class="team-link" onclick='openTeamPage(${safeJs(match.away)})'>${escapeHtml(match.away)}</span>
        </div>
      `}

      <div class="footer">
        <div class="channel">${tvSvg()}<span>${escapeHtml(broadcaster)}</span></div>
        <div class="actions">
          <button class="btn" onclick='downloadIcs(${JSON.stringify(match)})'>${calendarSvg()}+ Kalender</button>
          <button class="btn ${followed ? "following" : ""}" onclick='toggleFollow(${safeJs(actualFollowTarget)}, event)'>
            ${followed ? "✓ Följer" : "+ Följ"}
          </button>
        </div>
      </div>
    </article>`;
}

function renderHome() {
  const container = document.getElementById("appContent");
  const matches = filterMatches(allMatches());

  if (!matches.length) {
    container.innerHTML = `<div class="empty">Inga matcher att visa med de här filtren.</div>`;
    return;
  }

  const grouped = new Map();
  matches.forEach(match => {
    const parts = dateParts(match.startTime);
    if (!grouped.has(parts.dayKey)) {
      grouped.set(parts.dayKey, { label:parts.dateText, matches:[] });
    }
    grouped.get(parts.dayKey).matches.push(match);
  });

  const today = stockholmTodayKey();
  let html = "";

  grouped.forEach((group, dayKey) => {
    html += `
      <section class="date-section">
        <div class="date-title">
          <span>${escapeHtml(group.label)}</span>
          ${dayKey === today ? '<span class="today-chip">IDAG</span>' : ""}
        </div>
        <div class="cards">`;

    group.matches.forEach(match => {
      let followTarget = match.home;
      if (followedItems.includes(match.away) && !followedItems.includes(match.home)) {
        followTarget = match.away;
      }
      html += matchCard(match, followTarget);
    });

    html += `</div></section>`;
  });

  container.innerHTML = html;
}

function renderLeaguePage(name) {
  const league = leaguesData.find(l => l.name === name) || {
    name,
    sport: ESPN_SOURCES.find(source => source.name === name)?.sport || "Sport",
    matches: []
  };

  const followed = followedItems.includes(league.name);
  const container = document.getElementById("appContent");
  const loading = seasonLoading.has(`league:${name}`);
  const seasonMatches = leagueSeasonCache.get(name);
  const matches = seasonMatches || futureOnly(
    league.matches.map(match => ({ ...match, league: league.name, sport: league.sport }))
  );

  let html = `
    <div class="detail-head">
      <button class="back" onclick="goHome()">← Tillbaka till kalendern</button>
      <div class="profile">
        <div class="profile-top">
          <div>
            <div class="profile-icon">${league.name === "Formel 1" ? "🏎️" : "🏆"}</div>
            <h2>${escapeHtml(league.name)}</h2>
            <p>${escapeHtml(league.sport)} • Resterande säsong${seasonMatches ? ` • ${matches.length} event` : ""}</p>
          </div>
          <button class="btn ${followed ? "following" : ""}" onclick='toggleFollow(${safeJs(league.name)}, event)'>
            ${followed ? "✓ Följer" : "+ Följ"}
          </button>
        </div>
      </div>
    </div>
    <div class="cards">`;

  if (loading && !seasonMatches) {
    html += `<div class="empty">Laddar resten av säsongens schema…</div>`;
  } else if (matches.length) {
    matches.forEach(match => {
      html += matchCard(match, match.home || league.name);
    });
  } else {
    html += `<div class="empty">Inga kommande event hittades för resten av säsongen.</div>`;
  }

  html += "</div>";
  container.innerHTML = html;
}

function renderTeamPage(name) {
  const team = teamsData.find(t => t.name === name);
  if (!team) return goHome();

  const followed = followedItems.includes(team.name);
  const container = document.getElementById("appContent");
  const loading = seasonLoading.has(`team:${name}`);
  const seasonMatches = teamSeasonCache.get(name);
  const matches = seasonMatches || futureOnly(team.matches);

  let html = `
    <div class="detail-head">
      <button class="back" onclick="goHome()">← Tillbaka till kalendern</button>
      <div class="profile">
        <div class="profile-top">
          <div>
            <div class="profile-icon">${sportIcon(team.sport)}</div>
            <h2>${escapeHtml(team.name)}</h2>
            <p>${escapeHtml(team.leagues.join(" • "))} • Resterande säsong${seasonMatches ? ` • ${matches.length} matcher` : ""}</p>
          </div>
          <button class="btn ${followed ? "following" : ""}" onclick='toggleFollow(${safeJs(team.name)}, event)'>
            ${followed ? "✓ Följer" : "+ Följ"}
          </button>
        </div>
      </div>
    </div>
    <div class="cards">`;

  if (loading && !seasonMatches) {
    html += `<div class="empty">Laddar resten av säsongens spelschema…</div>`;
  } else if (matches.length) {
    matches.forEach(match => {
      html += matchCard(match, team.name);
    });
  } else {
    html += `<div class="empty">Inga kommande matcher hittades för resten av säsongen.</div>`;
  }

  html += "</div>";
  container.innerHTML = html;
}

function renderMain() {
  if (currentView.view === "league") {
    renderLeaguePage(currentView.name);
  } else if (currentView.view === "team") {
    renderTeamPage(currentView.name);
  } else {
    renderHome();
  }
}

function renderSearch(query) {
  const box = document.getElementById("searchResults");
  const q = query.trim().toLowerCase();

  if (!q) {
    box.classList.add("hidden");
    box.innerHTML = "";
    return;
  }

  const rank = value => {
    const valueText = String(value).toLowerCase();
    if (valueText === q) return 0;
    if (valueText.startsWith(q)) return 1;
    return 2;
  };

  const teams = teamsData
    .filter(team => team.name.toLowerCase().includes(q))
    .sort((a,b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name, "sv"))
    .slice(0, 8);

  const leagues = leaguesData
    .filter(league =>
      league.name.toLowerCase().includes(q) ||
      league.sport.toLowerCase().includes(q)
    )
    .sort((a,b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name, "sv"))
    .slice(0, 5);

  let html = "";

  if (teams.length) {
    html += `<div class="search-title">Lag</div>`;
    teams.forEach(team => {
      html += `
        <div class="result" onclick='openTeamPage(${safeJs(team.name)})'>
          <div class="result-main">
            <div class="result-name">${escapeHtml(team.name)}</div>
            <div class="result-sub">${escapeHtml(team.leagues.join(" • "))}</div>
          </div>
          <div class="result-kind">LAG</div>
        </div>`;
    });
  }

  if (leagues.length) {
    html += `<div class="search-title">Ligor / serier</div>`;
    leagues.forEach(league => {
      html += `
        <div class="result" onclick='openLeaguePage(${safeJs(league.name)})'>
          <div class="result-main">
            <div class="result-name">${escapeHtml(league.name)}</div>
            <div class="result-sub">${escapeHtml(league.sport)}</div>
          </div>
          <div class="result-kind">SERIE</div>
        </div>`;
    });
  }

  if (!leagues.length && !teams.length) {
    html = `<div class="empty" style="margin-top:18px">Inga träffar på “${escapeHtml(query)}”.</div>`;
  }

  box.innerHTML = html;
  box.classList.remove("hidden");
}

function renderFilterOptions() {
  const sports = [...new Set(leaguesData.map(l => l.sport))].sort();
  const leagues = leaguesData.map(l => l.name).sort();

  document.getElementById("sportFilters").innerHTML = sports.map(s => `
    <button class="filter-option ${selectedSports.has(s) ? "on" : ""}"
      onclick='toggleSportFilter(${safeJs(s)})'>${sportIcon(s)} ${escapeHtml(s)}</button>
  `).join("");

  document.getElementById("leagueFilters").innerHTML = leagues.map(l => `
    <button class="filter-option ${selectedLeagues.has(l) ? "on" : ""}"
      onclick='toggleLeagueFilter(${safeJs(l)})'>${escapeHtml(l)}</button>
  `).join("");

  document.getElementById("followedOnlyButton").classList.toggle("on", followedOnly);
}

function openFilters() {
  renderFilterOptions();
  document.getElementById("filterSheet").classList.remove("hidden");
}

function closeFilters() {
  document.getElementById("filterSheet").classList.add("hidden");
}

function backdropClose(event) {
  if (event.target.id === "filterSheet") closeFilters();
}

function toggleSportFilter(sport) {
  selectedSports.has(sport) ? selectedSports.delete(sport) : selectedSports.add(sport);
  renderFilterOptions();
  renderMain();
}

function toggleLeagueFilter(league) {
  selectedLeagues.has(league) ? selectedLeagues.delete(league) : selectedLeagues.add(league);
  renderFilterOptions();
  renderMain();
}

function toggleFollowedOnly() {
  followedOnly = !followedOnly;
  renderFilterOptions();
  renderMain();
}

function renderEverything() {
  renderMain();
  renderFilterOptions();

  const searchValue = document.getElementById("searchInput").value;
  if (searchValue.trim()) renderSearch(searchValue);
}

document.getElementById("tabs").addEventListener("click", event => {
  const button = event.target.closest(".tab");
  if (button) setTab(button.dataset.tab);
});

document.getElementById("searchInput").addEventListener("input", event => {
  renderSearch(event.target.value);
});

loadData();
</script>
