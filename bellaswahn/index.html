<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f19" />
  <title>Sportkalendern</title>
  <style>
    :root{
      --bg:#0b0f19;
      --panel:#121927;
      --panel-2:#172033;
      --panel-3:#0f1623;
      --line:#253044;
      --muted:#8f9aae;
      --text:#f7f9fc;
      --accent:#ff7417;
      --accent-2:#ff8c3a;
      --green:#2bd49b;
      --shadow:0 18px 45px rgba(0,0,0,.26);
      --radius:22px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    button,input{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}

    .shell{
      width:min(860px,100%);
      margin:0 auto;
      padding:0 18px 48px;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      backdrop-filter:blur(18px);
      background:rgba(11,15,25,.90);
      border-bottom:1px solid rgba(37,48,68,.78);
    }
    .topbar-inner{
      width:min(860px,100%);
      margin:0 auto;
      padding:18px;
    }

    .brand-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }
    .brand-icon{
      width:48px;
      height:48px;
      flex:0 0 48px;
      display:grid;
      place-items:center;
      border-radius:15px;
      background:linear-gradient(180deg,#ff8127 0%,#ff6808 100%);
      box-shadow:0 10px 24px rgba(255,116,23,.24);
    }
    .brand-icon svg{width:27px;height:27px}
    .brand h1{
      margin:0;
      font-size:clamp(22px,4.2vw,30px);
      letter-spacing:-.035em;
      line-height:1;
    }

    .head-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
    }
    .api-badge{
      border:1px solid rgba(43,212,155,.24);
      background:rgba(7,76,57,.42);
      color:#3be0aa;
      padding:9px 12px;
      border-radius:13px;
      font-size:12px;
      font-weight:800;
      letter-spacing:.03em;
      white-space:nowrap;
    }
    .icon-btn{
      border:1px solid var(--line);
      background:#182235;
      color:#dce4ef;
      width:46px;
      height:46px;
      display:grid;
      place-items:center;
      border-radius:15px;
      transition:.16s ease;
    }
    .icon-btn:hover{transform:translateY(-1px);border-color:#35425a;background:#1c2940}
    .icon-btn svg{width:22px;height:22px}

    .search-wrap{
      margin-top:20px;
      display:flex;
      gap:10px;
    }
    .search-box{
      flex:1;
      min-width:0;
      position:relative;
    }
    .search-box svg{
      position:absolute;
      left:16px;
      top:50%;
      transform:translateY(-50%);
      width:21px;
      height:21px;
      color:#78859a;
      pointer-events:none;
    }
    .search-box input{
      width:100%;
      border:1px solid #2a364b;
      background:#111827;
      color:white;
      border-radius:17px;
      padding:15px 16px 15px 49px;
      outline:none;
      transition:.16s ease;
      font-size:15px;
    }
    .search-box input::placeholder{color:#737f92}
    .search-box input:focus{
      border-color:#4a5870;
      box-shadow:0 0 0 3px rgba(255,116,23,.07);
    }

    .tabs{
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding:16px 0 3px;
      scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab{
      border:1px solid #2b3648;
      background:#172132;
      color:#bcc5d3;
      padding:10px 16px;
      border-radius:16px;
      font-weight:750;
      white-space:nowrap;
      transition:.16s ease;
      box-shadow:none;
    }
    .tab:hover{border-color:#3a485f;background:#1c293d}
    .tab.active{
      color:#fff;
      border-color:rgba(255,116,23,.7);
      background:linear-gradient(180deg,#ff7c22,#ff6f12);
      box-shadow:0 8px 22px rgba(255,116,23,.18);
    }

    main{padding-top:30px}
    .date-block{margin-bottom:34px}
    .date-head{
      display:flex;
      align-items:center;
      gap:12px;
      margin:0 0 15px;
      color:#a8b1c0;
      font-size:13px;
      font-weight:900;
      letter-spacing:.09em;
      text-transform:uppercase;
    }
    .today{
      color:#fff;
      background:var(--accent);
      border-radius:9px;
      padding:5px 9px;
      font-size:11px;
      letter-spacing:.02em;
    }

    .match-list{display:grid;gap:14px}
    .match-card{
      background:linear-gradient(180deg,#121927,#101722);
      border:1px solid #273247;
      border-radius:22px;
      padding:18px;
      box-shadow:0 14px 40px rgba(0,0,0,.15);
      transition:.17s ease;
    }
    .match-card:hover{border-color:#35435b;transform:translateY(-1px)}
    .match-meta{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:17px;
    }
    .league-pill,.time-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-width:0;
      border:1px solid #2b3649;
      background:#111827;
      border-radius:12px;
      padding:8px 11px;
      color:#b8c1cf;
      font-size:13px;
      font-weight:700;
    }
    .league-pill{
      max-width:70%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      cursor:pointer;
    }
    .league-pill strong{color:#f0f3f8}
    .time-pill{
      color:var(--accent-2);
      border-color:rgba(255,116,23,.36);
      background:rgba(88,42,18,.30);
      white-space:nowrap;
      flex:0 0 auto;
    }
    .teams{
      display:flex;
      align-items:baseline;
      gap:8px;
      flex-wrap:wrap;
      font-size:22px;
      font-weight:850;
      letter-spacing:-.03em;
      line-height:1.22;
    }
    .team-link{cursor:pointer;transition:.15s ease}
    .team-link:hover{color:var(--accent-2)}
    .vs{font-weight:600;color:var(--accent);font-size:.82em}
    .card-footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-top:19px;
      padding-top:14px;
      border-top:1px solid rgba(37,48,68,.68);
    }
    .channel{
      display:flex;
      align-items:center;
      gap:8px;
      color:#9ea8b8;
      font-size:14px;
      min-width:0;
    }
    .channel svg{width:18px;height:18px;color:var(--accent)}
    .card-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .action-btn{
      border:1px solid #2c3748;
      background:#1b2638;
      color:#d8dfe9;
      border-radius:12px;
      padding:9px 12px;
      font-size:13px;
      font-weight:800;
      transition:.15s ease;
    }
    .action-btn:hover{background:#223047;border-color:#3a4961}
    .action-btn.following{
      background:rgba(255,116,23,.13);
      color:#ff9a5a;
      border-color:rgba(255,116,23,.35);
    }

    .empty{
      text-align:center;
      color:#7f8a9c;
      padding:80px 16px;
      border:1px dashed #273247;
      border-radius:20px;
    }

    .detail-head{
      margin-bottom:18px;
    }
    .back-btn{
      border:0;
      background:transparent;
      color:#9ba6b7;
      padding:0;
      margin:0 0 14px;
      font-weight:700;
      font-size:13px;
    }
    .back-btn:hover{color:#fff}
    .hero-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      background:linear-gradient(180deg,#131c2b,#111827);
      border:1px solid #273247;
      border-radius:22px;
      padding:20px;
      box-shadow:var(--shadow);
    }
    .hero-card h2{
      margin:4px 0 5px;
      font-size:25px;
      letter-spacing:-.03em;
    }
    .hero-card p{margin:0;color:#8f9aae;font-size:13px}
    .hero-kicker{font-size:24px}
    .hero-left{min-width:0}

    .search-results{
      margin-top:14px;
      display:grid;
      gap:10px;
    }
    .result-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:14px 15px;
      background:#111827;
      border:1px solid #263146;
      border-radius:16px;
      cursor:pointer;
    }
    .result-card:hover{border-color:#37455e;background:#141d2c}
    .result-title{font-weight:850}
    .result-sub{font-size:12px;color:#8995a8;margin-top:3px}
    .result-type{font-size:12px;color:#ff9550;font-weight:800}
    .section-label{
      color:#8d99ab;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-size:11px;
      font-weight:900;
      margin:16px 0 8px;
    }

    .toast{
      position:fixed;
      z-index:60;
      left:50%;
      bottom:24px;
      transform:translateX(-50%);
      background:#182235;
      border:1px solid #33415a;
      color:white;
      border-radius:13px;
      padding:11px 14px;
      font-size:13px;
      font-weight:750;
      box-shadow:0 12px 35px rgba(0,0,0,.38);
      animation:toastin .18s ease;
    }
    @keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

    @media (min-width:720px){
      .topbar-inner{padding:18px 24px}
      .shell{padding-left:24px;padding-right:24px}
      .match-list{grid-template-columns:repeat(2,minmax(0,1fr))}
      .date-head{grid-column:1/-1}
    }

    @media (max-width:560px){
      .shell{padding-left:14px;padding-right:14px}
      .topbar-inner{padding:15px 14px}
      .brand-icon{width:46px;height:46px;flex-basis:46px}
      .brand h1{font-size:23px}
      .api-badge{padding:8px 10px;font-size:11px}
      .icon-btn{width:44px;height:44px}
      .search-wrap{margin-top:16px}
      main{padding-top:25px}
      .match-card{padding:16px}
      .teams{font-size:20px}
      .card-footer{align-items:flex-end}
      .channel{font-size:13px}
      .action-btn{padding:9px 10px}
    }

    @media (max-width:420px){
      .brand{gap:10px}
      .brand h1{font-size:20px}
      .api-badge{display:none}
      .match-meta{align-items:flex-start}
      .league-pill{max-width:66%}
      .card-footer{display:block}
      .card-actions{margin-top:12px;justify-content:flex-start}
      .action-btn{flex:1}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand" onclick="goHome()" role="button" tabindex="0" aria-label="Till startsidan">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M16 3v4M8 3v4M3 10h18"></path>
              <path d="M7.5 14h2M11 14h2M14.5 14h2M7.5 17h2M11 17h2M14.5 17h2"></path>
            </svg>
          </div>
          <h1>Sportkalendern</h1>
        </div>
        <div class="head-actions">
          <span class="api-badge">● LIVE API</span>
          <button class="icon-btn" id="filterButton" title="Visa filter" aria-label="Visa filter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
              <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"></path>
              <path d="M1 14h6M9 8h6M17 16h6"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.2-3.2"></path>
          </svg>
          <input id="globalSearch" type="search" placeholder="Sök lag, liga eller sport..." autocomplete="off" />
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="Alla">Alla</button>
        <button class="tab" data-tab="Mina Val">⭐ Mina Val</button>
        <button class="tab" data-tab="Fotboll">⚽ Fotboll</button>
        <button class="tab" data-tab="Ishockey">🏒 Ishockey</button>
      </div>
    </div>
  </header>

  <div class="shell">
    <div id="searchResults" class="search-results hidden"></div>
    <main id="app"></main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    "use strict";

    let activeTab = "Alla";
    let currentView = { view: "home" };
    let toastTimer = null;

    const defaultFollows = ["Arsenal", "Premier League"];
    let followedItems = [...defaultFollows];

    try {
      const saved = JSON.parse(localStorage.getItem("sportkalendern_follows"));
      if (Array.isArray(saved)) followedItems = saved;
    } catch (err) {
      localStorage.removeItem("sportkalendern_follows");
    }

    const leaguesData = [
      {
        id: "pl",
        name: "Premier League",
        sport: "Fotboll",
        matches: [
          { id: 101, home: "Chelsea", away: "Liverpool", date: "Lördag, 3 Okt", isoDate: "2026-10-03", time: "16:00", channel: "Viaplay", isToday: true },
          { id: 102, home: "Arsenal", away: "Leeds United", date: "Lördag, 10 Okt", isoDate: "2026-10-10", time: "13:30", channel: "Viaplay" },
          { id: 103, home: "Arsenal", away: "Chelsea", date: "Lördag, 24 Okt", isoDate: "2026-10-24", time: "18:30", channel: "Viaplay" },
          { id: 104, home: "Manchester United", away: "Arsenal", date: "Söndag, 1 Nov", isoDate: "2026-11-01", time: "17:00", channel: "Viaplay" },
          { id: 105, home: "Arsenal", away: "Liverpool", date: "Lördag, 7 Nov", isoDate: "2026-11-07", time: "16:00", channel: "Viaplay" }
        ]
      },
      {
        id: "ucl",
        name: "Champions League",
        sport: "Fotboll",
        matches: [
          { id: 201, home: "Arsenal", away: "LOSC Lille", date: "Tisdag, 13 Okt", isoDate: "2026-10-13", time: "21:00", channel: "TV4 Play" },
          { id: 202, home: "Real Madrid", away: "FC Bayern München", date: "Onsdag, 14 Okt", isoDate: "2026-10-14", time: "21:00", channel: "TV4 Play" },
          { id: 203, home: "Barcelona", away: "Arsenal", date: "Tisdag, 27 Okt", isoDate: "2026-10-27", time: "21:00", channel: "TV4 Play" }
        ]
      },
      {
        id: "nhl",
        name: "NHL",
        sport: "Ishockey",
        matches: [
          { id: 301, home: "New York Rangers", away: "Boston Bruins", date: "Söndag, 4 Okt", isoDate: "2026-10-04", time: "01:00", channel: "Viaplay" },
          { id: 302, home: "Toronto Maple Leafs", away: "Montreal Canadiens", date: "Måndag, 5 Okt", isoDate: "2026-10-05", time: "01:00", channel: "Viaplay" }
        ]
      }
    ];

    const teamsMap = {};
    leaguesData.forEach(league => {
      league.matches.forEach(match => {
        [match.home, match.away].forEach(teamName => {
          if (!teamsMap[teamName]) {
            teamsMap[teamName] = {
              name: teamName,
              sport: league.sport,
              leagues: new Set(),
              matches: []
            };
          }
          teamsMap[teamName].leagues.add(league.name);
          teamsMap[teamName].matches.push({ ...match, league: league.name, sport: league.sport });
        });
      });
    });

    const teamsData = Object.values(teamsMap).map(team => ({
      ...team,
      leagues: Array.from(team.leagues)
    }));

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeJsString(value) {
      return JSON.stringify(String(value));
    }

    function sportIcon(sport) {
      return sport === "Ishockey" ? "🏒" : "⚽";
    }

    function saveFollows() {
      localStorage.setItem("sportkalendern_follows", JSON.stringify(followedItems));
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("hidden"), 2200);
    }

    function toggleFollow(name, event) {
      if (event) event.stopPropagation();
      if (followedItems.includes(name)) {
        followedItems = followedItems.filter(item => item !== name);
        showToast("Slutade följa " + name);
      } else {
        followedItems.push(name);
        showToast("Följer nu " + name);
      }
      saveFollows();
      render();
      renderSearchResults(document.getElementById("globalSearch").value);
    }

    function goHome() {
      currentView = { view: "home" };
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    }

    function openLeaguePage(name) {
      currentView = { view: "league", name };
      document.getElementById("globalSearch").value = "";
      hideSearchResults();
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    }

    function openTeamPage(name) {
      currentView = { view: "team", name };
      document.getElementById("globalSearch").value = "";
      hideSearchResults();
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    }

    function setActiveTab(tab) {
      activeTab = tab;
      currentView = { view: "home" };
      document.querySelectorAll(".tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      render();
    }

    function hideSearchResults() {
      const box = document.getElementById("searchResults");
      box.innerHTML = "";
      box.classList.add("hidden");
    }

    function renderSearchResults(query) {
      const box = document.getElementById("searchResults");
      const q = query.trim().toLowerCase();

      if (!q) {
        hideSearchResults();
        return;
      }

      const leagues = leaguesData.filter(l =>
        l.name.toLowerCase().includes(q) ||
        l.sport.toLowerCase().includes(q)
      );

      const teams = teamsData.filter(t =>
        t.name.toLowerCase().includes(q) ||
        t.sport.toLowerCase().includes(q) ||
        t.leagues.some(l => l.toLowerCase().includes(q))
      );

      let html = "";

      if (leagues.length) {
        html += '<div class="section-label">Ligor</div>';
        leagues.forEach(l => {
          html += `
            <div class="result-card" onclick='openLeaguePage(${safeJsString(l.name)})'>
              <div>
                <div class="result-title">${escapeHtml(l.name)}</div>
                <div class="result-sub">${escapeHtml(l.sport)} • Hela säsongen</div>
              </div>
              <div class="result-type">LIGA</div>
            </div>`;
        });
      }

      if (teams.length) {
        html += '<div class="section-label">Lag</div>';
        teams.forEach(t => {
          html += `
            <div class="result-card" onclick='openTeamPage(${safeJsString(t.name)})'>
              <div>
                <div class="result-title">${escapeHtml(t.name)}</div>
                <div class="result-sub">${escapeHtml(t.leagues.join(" • "))} • ${escapeHtml(t.sport)}</div>
              </div>
              <div class="result-type">LAG</div>
            </div>`;
        });
      }

      if (!leagues.length && !teams.length) {
        html = `<div class="empty">Inga träffar på “${escapeHtml(query)}”.</div>`;
      }

      box.innerHTML = html;
      box.classList.remove("hidden");
    }

    function allMatches() {
      return leaguesData
        .flatMap(league => league.matches.map(match => ({ ...match, league: league.name, sport: league.sport })))
        .sort((a, b) => {
          const ad = `${a.isoDate || ""}T${a.time || "00:00"}`;
          const bd = `${b.isoDate || ""}T${b.time || "00:00"}`;
          return ad.localeCompare(bd);
        });
    }

    function filterMatches(matches) {
      if (activeTab === "Mina Val") {
        return matches.filter(m =>
          followedItems.includes(m.league) ||
          followedItems.includes(m.home) ||
          followedItems.includes(m.away)
        );
      }
      if (activeTab === "Fotboll" || activeTab === "Ishockey") {
        return matches.filter(m => m.sport === activeTab);
      }
      return matches;
    }

    function calendarSvg() {
      return `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" style="width:16px;height:16px;vertical-align:-3px;margin-right:5px">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect>
          <path d="M16 3v4M8 3v4M3 10h18"></path>
        </svg>`;
    }

    function tvSvg() {
      return `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <rect x="3" y="5" width="18" height="13" rx="2"></rect>
          <path d="M8 21h8M12 18v3"></path>
        </svg>`;
    }

    function makeIcs(match) {
      const date = match.isoDate || "2026-10-03";
      const time = match.time || "12:00";
      const start = new Date(`${date}T${time}:00`);
      const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);

      const fmt = d => {
        const pad = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
      };

      const ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Sportkalendern//SV",
        "BEGIN:VEVENT",
        `UID:sportkalendern-${match.id}@local`,
        `DTSTART:${fmt(start)}`,
        `DTEND:${fmt(end)}`,
        `SUMMARY:${match.home} vs ${match.away}`,
        `DESCRIPTION:${match.league} • ${match.channel}`,
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");

      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${match.home}-vs-${match.away}.ics`.replace(/[^\w\-\.]+/g, "-");
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("Kalenderfil skapad");
    }

    function matchCard(match, followTarget) {
      const isFollowed = followedItems.includes(followTarget);
      return `
        <article class="match-card">
          <div class="match-meta">
            <div class="league-pill" onclick='openLeaguePage(${safeJsString(match.league)})'>
              <span>${sportIcon(match.sport)}</span>
              <span>${escapeHtml(match.sport)} <span style="color:#49566a">•</span> <strong>${escapeHtml(match.league)}</strong></span>
            </div>
            <div class="time-pill">◷ ${escapeHtml(match.time)}</div>
          </div>

          <div class="teams">
            <span class="team-link" onclick='openTeamPage(${safeJsString(match.home)})'>${escapeHtml(match.home)}</span>
            <span class="vs">vs</span>
            <span class="team-link" onclick='openTeamPage(${safeJsString(match.away)})'>${escapeHtml(match.away)}</span>
          </div>

          <div class="card-footer">
            <div class="channel">${tvSvg()}<span>${escapeHtml(match.channel)}</span></div>
            <div class="card-actions">
              <button class="action-btn" onclick='makeIcs(${JSON.stringify(match)})'>${calendarSvg()}+ Kalender</button>
              <button class="action-btn ${isFollowed ? "following" : ""}" onclick='toggleFollow(${safeJsString(followTarget)}, event)'>
                ${isFollowed ? "✓ Följer" : "+ Följ"}
              </button>
            </div>
          </div>
        </article>`;
    }

    function renderHome(container) {
      const matches = filterMatches(allMatches());
      if (!matches.length) {
        container.innerHTML = `<div class="empty">Inga matcher att visa för det här filtret.</div>`;
        return;
      }

      const groups = {};
      matches.forEach(match => {
        if (!groups[match.date]) groups[match.date] = [];
        groups[match.date].push(match);
      });

      let html = "";
      Object.entries(groups).forEach(([date, group]) => {
        const today = group.some(m => m.isToday);
        html += `<section class="date-block">
          <div class="date-head">
            <span>${escapeHtml(date)}</span>
            ${today ? '<span class="today">IDAG</span>' : ""}
          </div>
          <div class="match-list">`;

        group.forEach(match => {
          const followTarget = followedItems.includes(match.away) ? match.away : match.home;
          html += matchCard(match, followTarget);
        });

        html += `</div></section>`;
      });

      container.innerHTML = html;
    }

    function renderLeaguePage(container, leagueName) {
      const league = leaguesData.find(l => l.name === leagueName);
      if (!league) return goHome();

      const isFollowed = followedItems.includes(league.name);
      let html = `
        <div class="detail-head">
          <button class="back-btn" onclick="goHome()">← Tillbaka till kalendern</button>
          <div class="hero-card">
            <div class="hero-left">
              <div class="hero-kicker">🏆</div>
              <h2>${escapeHtml(league.name)}</h2>
              <p>${escapeHtml(league.sport)} • Säsong 2026/2027 • Alla matcher</p>
            </div>
            <button class="action-btn ${isFollowed ? "following" : ""}" onclick='toggleFollow(${safeJsString(league.name)}, event)'>
              ${isFollowed ? "✓ Följer ligan" : "+ Följ ligan"}
            </button>
          </div>
        </div>
        <div class="match-list">`;

      league.matches.forEach(match => {
        html += matchCard({ ...match, league: league.name, sport: league.sport }, match.home);
      });

      html += "</div>";
      container.innerHTML = html;
    }

    function renderTeamPage(container, teamName) {
      const team = teamsData.find(t => t.name === teamName);
      if (!team) return goHome();

      const isFollowed = followedItems.includes(team.name);
      let html = `
        <div class="detail-head">
          <button class="back-btn" onclick="goHome()">← Tillbaka till kalendern</button>
          <div class="hero-card">
            <div class="hero-left">
              <div class="hero-kicker">${sportIcon(team.sport)}</div>
              <h2>${escapeHtml(team.name)}</h2>
              <p>${escapeHtml(team.leagues.join(" • "))} • ${escapeHtml(team.sport)} • Säsongsschema</p>
            </div>
            <button class="action-btn ${isFollowed ? "following" : ""}" onclick='toggleFollow(${safeJsString(team.name)}, event)'>
              ${isFollowed ? "✓ Följer laget" : "+ Följ laget"}
            </button>
          </div>
        </div>
        <div class="match-list">`;

      team.matches
        .slice()
        .sort((a,b) => `${a.isoDate}T${a.time}`.localeCompare(`${b.isoDate}T${b.time}`))
        .forEach(match => {
          html += matchCard(match, team.name);
        });

      html += "</div>";
      container.innerHTML = html;
    }

    function render() {
      const container = document.getElementById("app");
      if (!container) return;

      if (currentView.view === "league") {
        renderLeaguePage(container, currentView.name);
      } else if (currentView.view === "team") {
        renderTeamPage(container, currentView.name);
      } else {
        renderHome(container);
      }
    }

    document.getElementById("tabs").addEventListener("click", event => {
      const btn = event.target.closest(".tab");
      if (!btn) return;
      setActiveTab(btn.dataset.tab);
    });

    document.getElementById("globalSearch").addEventListener("input", event => {
      renderSearchResults(event.target.value);
    });

    document.getElementById("filterButton").addEventListener("click", () => {
      document.getElementById("tabs").scrollIntoView({ behavior: "smooth", block: "nearest" });
      showToast("Välj filter nedanför sökfältet");
    });

    render();
  </script>
</body>
</html>
