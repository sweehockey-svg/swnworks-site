<body class="bg-[#0b0b0e] text-gray-100 min-h-screen flex flex-col antialiased selection:bg-[#ef4444] selection:text-white pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#0b0b0e]/95 backdrop-blur-md border-b border-gray-800/80 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">

                    <rect x="112" y="256" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="192" y="256" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="272" y="256" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="352" y="256" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="112" y="336" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="192" y="336" width="48" height="48" rx="8" fill="#9ca3af"/>

            <h1 class="text-xl font-bold tracking-tight text-white">Next<span class="text-[#ef4444]">Week</span></h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openSearchModal()" class="w-10 h-10 bg-[#16161a] hover:bg-gray-800 border border-gray-800 rounded-full flex items-center justify-center text-gray-300 transition-colors shadow-sm">

            </button>
            <button onclick="openSearchModal()" class="w-10 h-10 bg-[#16161a] hover:bg-gray-800 border border-gray-800 rounded-full flex items-center justify-center text-gray-300 transition-colors shadow-sm">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </button>

    <!-- Huvudinnehåll: Veckovy -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-6" id="week-container">
        <!-- Genereras dynamiskt via JS -->
    </main>

    <!-- Sök & Lägg till-modal -->
    <div id="search-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
        <div class="bg-[#121216] border border-gray-800 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between">
                <h3 class="text-lg font-bold text-white">Sök lag, serie eller film</h3>
                <button onclick="closeSearchModal()" class="w-8 h-8 rounded-full bg-gray-800/60 flex items-center justify-center text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 border-b border-gray-800/60">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
                    <input type="text" id="search-input" placeholder="T.ex. Arsenal, Brooklyn Nets, Ted Lasso..." oninput="handleSearch(this.value)" class="w-full bg-[#1c1c24] border border-gray-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#ef4444]">
                </div>
            </div>
            <div id="search-results" class="flex-1 overflow-y-auto p-4 space-y-3 max-h-[50vh]">
                <div class="text-center text-gray-500 py-8 text-sm">Sök efter sportlag (t.ex. Arsenal, Brooklyn Nets), serier eller filmer...</div>
            </div>
        </div>
    </div>

    <!-- Datumväljare-modal -->
    <div id="date-picker-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-[#121216] border border-gray-800 w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white text-center">Välj datum</h3>
            <input type="date" id="custom-date-input" class="w-full bg-[#1c1c24] border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#ef4444]">
            <div class="flex space-x-3 pt-2">
                <button onclick="closeDatePicker()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl text-sm font-medium transition-colors">Avbryt</button>
                <button onclick="confirmCustomDate()" class="flex-1 bg-[#ef4444] hover:bg-red-600 text-white py-2.5 rounded-xl text-sm font-medium transition-colors">Flytta</button>
            </div>
        </div>
    </div>

    <script>
        // Startdata / State
        let scheduleData = JSON.parse(localStorage.getItem('nextweek_schedule')) || {
            "2026-10-04": [
                { id: "1", title: "New York Rangers vs Utah Mammoth", type: "sport", channel: "Viaplay", time: "00:00", completed: false },
                { id: "2", title: "Slow Horses - S04E05", type: "series", channel: "Apple TV+", time: "21:00", completed: false }
            ],
            "2026-10-07": [
                { id: "5", title: "Arsenal vs Chelsea", type: "sport", channel: "Viaplay / Viasat", time: "17:30", completed: false }
            ]
        };

        let selectedItemForDateMove = null;
        let draggedItemId = null;

        function getDaysArray() {
            let days = [];
            let today = new Date("2026-10-04");
            for (let i = -3; i <= 14; i++) {
                let d = new Date(today);
                d.setDate(today.getDate() + i);
                days.push({
                    dateStr: d.toISOString().split('T')[0],
                    displayDate: d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' }),
                    dayName: d.toLocaleDateString('sv-SE', { weekday: 'short' }),
                    isToday: i === 0
                });
            }
            return days;
        }

        function renderApp() {
            localStorage.setItem('nextweek_schedule', JSON.stringify(scheduleData));
            const container = document.getElementById('week-container');
            container.innerHTML = '';

            let days = getDaysArray();

            days.forEach(day => {
                let items = scheduleData[day.dateStr] || [];
                
                let dayCard = document.createElement('div');
                dayCard.className = `bg-[#121216] border ${day.isToday ? 'border-[#ef4444]/60 shadow-lg shadow-[#ef4444]/5' : 'border-gray-800/80'} rounded-2xl p-4 space-y-3 transition-all`;
                dayCard.setAttribute('data-date', day.dateStr);

                dayCard.addEventListener('dragover', (e) => e.preventDefault());
                dayCard.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedItemId) {
                        moveItemToDate(draggedItemId, day.dateStr);
                        draggedItemId = null;
                    }
                });

                let headerHtml = `
                    <div class="flex items-center justify-between border-b border-gray-800/60 pb-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-base font-bold text-white capitalize">${day.displayDate}</span>
                            ${day.isToday ? '<span class="bg-[#ef4444] text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Idag</span>' : ''}
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">${day.dayName}</span>
                            <button onclick="openSearchModal()" class="text-gray-500 hover:text-white p-1"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>
                `;

                let listHtml = `<div class="space-y-2.5 min-h-[40px]">`;
                if (items.length === 0) {
                    listHtml += `<div class="text-xs text-gray-600 italic py-2 text-center">Inga inplanerade aktiviteter</div>`;
                } else {
                    items.forEach((item) => {
                        listHtml += `
                            <div draggable="true" 
                                 ondragstart="draggedItemId = '${item.id}'"
                                 class="bg-[#1a1a22] border border-gray-800/80 rounded-xl p-3 flex items-center justify-between group hover:border-gray-700 transition-all cursor-grab active:cursor-grabbing">
                                <div class="flex items-center space-x-3 flex-1 min-w-0 pr-2">
                                    <button onclick="toggleComplete('${day.dateStr}', '${item.id}')" class="w-5 h-5 rounded-full border ${item.completed ? 'bg-[#ef4444] border-[#ef4444] text-white' : 'border-gray-600 hover:border-gray-400'} flex items-center justify-center text-xs transition-colors shrink-0">
                                        ${item.completed ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                                    </button>
                                    <div class="min-w-0 flex-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-[10px] font-medium px-2 py-0.5 rounded bg-gray-800 text-gray-300">${item.type === 'sport' ? 'Sport' : 'Serie/Film'}</span>
                                            <span class="text-[10px] text-gray-400 font-medium">${item.channel || 'Streaming'}</span>
                                        </div>
                                        <h4 class="text-sm font-semibold text-white truncate mt-0.5 ${item.completed ? 'line-through text-gray-500' : ''}">${item.title}</h4>
                                    </div>
                                </div>
                                <div class="relative">
                                    <button onclick="toggleDropdown('${item.id}', event)" class="w-8 h-8 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 flex items-center justify-center transition-colors">
                                        <i class="fa-solid fa-ellipsis-vertical"></i>
                                    </button>
                                    <div id="dropdown-${item.id}" class="hidden absolute right-0 mt-1 w-48 bg-[#1c1c24] border border-gray-800 rounded-xl shadow-xl z-30 py-1 text-xs">
                                        <button onclick="moveTomorrow('${day.dateStr}', '${item.id}')" class="w-full text-left px-4 py-2.5 text-gray-300 hover:bg-gray-800 hover:text-white flex items-center space-x-2">
                                            <i class="fa-solid fa-forward text-gray-400 w-4"></i><span>Flytta till imorgon</span>
                                        </button>
                                        <button onclick="moveNextWeek('${day.dateStr}', '${item.id}')" class="w-full text-left px-4 py-2.5 text-gray-300 hover:bg-gray-800 hover:text-white flex items-center space-x-2">
                                            <i class="fa-solid fa-calendar-week text-gray-400 w-4"></i><span>Nästa vecka</span>
                                        </button>
                                        <button onclick="openDatePicker('${day.dateStr}', '${item.id}')" class="w-full text-left px-4 py-2.5 text-gray-300 hover:bg-gray-800 hover:text-white flex items-center space-x-2">
                                            <i class="fa-solid fa-calendar-days text-gray-400 w-4"></i><span>Välj datum...</span>
                                        </button>
                                        <div class="border-t border-gray-800 my-1"></div>
                                        <button onclick="deleteItem('${day.dateStr}', '${item.id}')" class="w-full text-left px-4 py-2.5 text-red-400 hover:bg-red-500/10 flex items-center space-x-2">
                                            <i class="fa-solid fa-trash w-4"></i><span>Ta bort</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                listHtml += `</div>`;

                dayCard.innerHTML = headerHtml + listHtml;
                container.appendChild(dayCard);
            });
        }

        function scrollToToday() {
            setTimeout(() => {
                const todayCard = document.querySelector(`[data-date="2026-10-04"]`);
                if (todayCard) {
                    todayCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 100);
        }

        function openSearchModal() {
            document.getElementById('search-modal').classList.add('flex');
            document.getElementById('search-modal').classList.remove('hidden');
            document.getElementById('search-input').focus();
        }

        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('hidden');
            document.getElementById('search-modal').classList.remove('flex');
        }

        async function handleSearch(query) {
            const resultsContainer = document.getElementById('search-results');
            if (!query || query.trim().length < 2) {
                resultsContainer.innerHTML = `<div class="text-center text-gray-500 py-8 text-sm">Sök efter sportlag (t.ex. Arsenal, Brooklyn Nets), serier eller filmer...</div>`;
                return;
            }

            resultsContainer.innerHTML = `<div class="text-center text-gray-400 py-8 text-sm"><i class="fa-solid fa-spinner animate-spin mr-2"></i>Söker lag och matcher...</div>`;

            let q = query.toLowerCase();
            let html = '';

            // Om sökningen matchar sportlag
            if (q.includes('arsenal') || q.includes('brooklyn') || q.includes('nets') || q.includes('rangers') || q.includes('fc barcelona') || q.includes('liverpool') || q.includes('tottenham') || q.includes('united')) {
                let teamName = q.includes('arsenal') ? 'Arsenal FC' : q.includes('brooklyn') || q.includes('nets') ? 'Brooklyn Nets' : q.includes('rangers') ? 'New York Rangers' : q.includes('barcelona') ? 'FC Barcelona' : query;
                let channel = q.includes('arsenal') || q.includes('liverpool') || q.includes('barcelona') || q.includes('tottenham') ? 'Viaplay / Viasat Sport' : 'Disney+ / NBA TV';
                
                html += `
                    <div class="bg-[#1c1c24] border border-gray-800 p-4 rounded-xl space-y-3">
                        <div class="flex items-center space-x-3">
                            <div class="w-12 h-12 bg-[#ef4444]/15 text-[#ef4444] rounded-xl flex items-center justify-center text-lg"><i class="fa-solid fa-shield-halved"></i></div>
                            <div>
                                <h4 class="text-base font-bold text-white">${teamName}</h4>
                                <p class="text-xs text-gray-400">Sportlag • Alla säsongens matcher</p>
                            </div>
                        </div>
                        <button onclick="addAllTeamMatches('${teamName}', '${channel}')" class="w-full bg-[#ef4444] hover:bg-red-600 text-white text-xs font-bold py-2.5 rounded-xl transition-colors flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-calendar-plus"></i>
                            <span>📅 Lägg till alla matcher för säsongen</span>
                        </button>
                    </div>
                `;
            }

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=3fd2be6f0c70a2a598f084ddfb75487c&language=sv-SE&query=${encodeURIComponent(query)}`);
                const data = await response.json();
                let results = data.results || [];

                results.forEach(item => {
                    if (item.media_type === 'movie' || item.media_type === 'tv') {
                        let title = item.title || item.name;
                        let date = item.release_date || item.first_air_date || '2026-10-04';
                        let type = item.media_type === 'tv' ? 'series' : 'movie';
                        let poster = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : null;

                        html += `
                            <div onclick="addItemToCalendar('${title.replace(/'/g, "\\'")}', '${type}', 'Netflix / HBO', '${date}')" class="bg-[#1c1c24] hover:bg-gray-800 border border-gray-800 p-3 rounded-xl flex items-center justify-between cursor-pointer transition-colors">
                                <div class="flex items-center space-x-3">
                                    ${poster ? `<img src="${poster}" class="w-10 h-14 object-cover rounded-md">` : `<div class="w-10 h-14 bg-gray-800 rounded-md flex items-center justify-center text-gray-500"><i class="fa-solid fa-film"></i></div>`}
                                    <div>
                                        <h4 class="text-sm font-bold text-white">${title}</h4>
                                        <p class="text-xs text-gray-400">${type === 'series' ? 'TV-serie' : 'Film'} • ${date}</p>
                                    </div>
                                </div>
                                <span class="text-xs bg-[#ef4444] text-white px-3 py-1.5 rounded-lg font-medium">Lägg till</span>
                            </div>
                        `;
                    }
                });
            } catch (err) {}

            if (!html) {
                html = `<div class="text-center text-gray-500 py-8 text-sm">Inga träffar hittades. Testa sök på Arsenal, Brooklyn Nets eller en serie.</div>`;
            }

            resultsContainer.innerHTML = html;
        }

        function addAllTeamMatches(teamName, channel) {
            let matchOpponents = ["vs Manchester United", "vs Liverpool", "vs Tottenham", "vs Chelsea", "vs Manchester City", "vs Newcastle"];
            if (teamName.includes('Nets')) {
                matchOpponents = ["vs Boston Celtics", "vs New York Knicks", "vs Chicago Bulls", "vs Miami Heat", "vs Los Angeles Lakers"];
            } else if (teamName.includes('Rangers')) {
                matchOpponents = ["vs New Jersey Devils", "vs Philadelphia Flyers", "vs Washington Capitals", "vs Pittsburgh Penguins"];
            }

            let today = new Date("2026-10-04");
            matchOpponents.forEach((opp, index) => {
                let matchDate = new Date(today);
                matchDate.setDate(today.getDate() + (index * 3) + 1);
                let dateStr = matchDate.toISOString().split('T')[0];

                if (!scheduleData[dateStr]) scheduleData[dateStr] = [];
                scheduleData[dateStr].push({
                    id: '_' + Math.random().toString(36).substr(2, 9),
                    title: `${teamName} ${opp}`,
                    type: 'sport',
                    channel: channel,
                    time: "19:00",
                    completed: false
                });
            });

            closeSearchModal();
            renderApp();
        }

        function addItemToCalendar(title, type, channel, dateStr) {
            if (!scheduleData[dateStr]) dateStr = "2026-10-04";
            if (!scheduleData[dateStr]) scheduleData[dateStr] = [];

            scheduleData[dateStr].push({
                id: '_' + Math.random().toString(36).substr(2, 9),
                title: title,
                type: type,
                channel: channel,
                time: "20:00",
                completed: false
            });

            closeSearchModal();
            renderApp();
        }

        function toggleDropdown(id, event) {
            event.stopPropagation();
            let dropdown = document.getElementById(`dropdown-${id}`);
            document.querySelectorAll('[id^="dropdown-"]').forEach(el => {
                if (el.id !== `dropdown-${id}`) el.classList.add('hidden');
            });
            dropdown.classList.toggle('hidden');
        }

        window.addEventListener('click', () => {
            document.querySelectorAll('[id^="dropdown-"]').forEach(el => el.classList.add('hidden'));
        });

        function toggleComplete(dateStr, id) {
            let item = scheduleData[dateStr].find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                renderApp();
            }
        }

        function deleteItem(dateStr, id) {
            scheduleData[dateStr] = scheduleData[dateStr].filter(i => i.id !== id);
            renderApp();
        }

        function moveTomorrow(currentDateStr, id) {
            let itemIndex = scheduleData[currentDateStr].findIndex(i => i.id === id);
            if (itemIndex > -1) {
                let item = scheduleData[currentDateStr].splice(itemIndex, 1)[0];
                let currDate = new Date(currentDateStr);
                currDate.setDate(currDate.getDate() + 1);
                let nextDateStr = currDate.toISOString().split('T')[0];
                if (!scheduleData[nextDateStr]) scheduleData[nextDateStr] = [];
                scheduleData[nextDateStr].push(item);
                renderApp();
            }
        }

        function moveNextWeek(currentDateStr, id) {
            let itemIndex = scheduleData[currentDateStr].findIndex(i => id === i.id);
            if (itemIndex > -1) {
                let item = scheduleData[currentDateStr].splice(itemIndex, 1)[0];
                let currDate = new Date(currentDateStr);
                currDate.setDate(currDate.getDate() + 7);
                let nextDateStr = currDate.toISOString().split('T')[0];
                if (!scheduleData[nextDateStr]) scheduleData[nextDateStr] = [];
                scheduleData[nextDateStr].push(item);
                renderApp();
            }
        }

        function moveItemToDate(id, targetDateStr) {
            let foundItem = null;
            for (let d in scheduleData) {
                let idx = scheduleData[d].findIndex(i => i.id === id);
                if (idx > -1) {
                    foundItem = scheduleData[d].splice(idx, 1)[0];
                    break;
                }
            }
            if (foundItem) {
                if (!scheduleData[targetDateStr]) scheduleData[targetDateStr] = [];
                scheduleData[targetDateStr].push(foundItem);
                renderApp();
            }
        }

        function openDatePicker(dateStr, id) {
            selectedItemForDateMove = { dateStr, id };
            document.getElementById('custom-date-input').value = dateStr;
            document.getElementById('date-picker-modal').classList.remove('hidden');
            document.getElementById('date-picker-modal').classList.add('flex');
        }

<body class="bg-[#0b0b0e] text-gray-100 min-h-screen flex flex-col antialiased selection:bg-[#ef4444] selection:text-white pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#0b0b0e]/95 backdrop-blur-md border-b border-gray-800/80 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">

                    <rect x="112" y="256" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="192" y="256" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="272" y="256" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="352" y="256" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="112" y="336" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="192" y="336" width="48" height="48" rx="8" fill="#9ca3af"/>
                    <rect x="272" y="336" width="48" height="48" rx="8" fill="#ef4444"/>
                    <text x="285" y="455" font-family="Arial Black, sans-serif" font-weight="900" font-size="65" fill="#ef4444">NW</text>

            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">Next<span class="text-[#ef4444]">Week</span></h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openSearchModal()" class="w-10 h-10 bg-[#16161a] hover:bg-gray-800 border border-gray-800 rounded-full flex items-center justify-center text-gray-300 transition-colors shadow-sm">
                <i class="fa-solid fa-plus text-sm"></i>
            </button>
            <button onclick="openSearchModal()" class="w-10 h-10 bg-[#16161a] hover:bg-gray-800 border border-gray-800 rounded-full flex items-center justify-center text-gray-300 transition-colors shadow-sm">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Huvudinnehåll: Veckovy -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-6" id="week-container">
        <!-- Genereras dynamiskt via JS -->
    </main>

    <!-- Sök & Lägg till-modal -->
    <div id="search-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
        <div class="bg-[#121216] border border-gray-800 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between">
                <h3 class="text-lg font-bold text-white">Sök lag, serie eller film</h3>
                <button onclick="closeSearchModal()" class="w-8 h-8 rounded-full bg-gray-800/60 flex items-center justify-center text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 border-b border-gray-800/60">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
                    <input type="text" id="search-input" placeholder="T.ex. Arsenal, Brooklyn Nets, Ted Lasso..." oninput="handleSearch(this.value)" class="w-full bg-[#1c1c24] border border-gray-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#ef4444]">
                </div>
            </div>
            <div id="search-results" class="flex-1 overflow-y-auto p-4 space-y-3 max-h-[50vh]">
                <div class="text-center text-gray-500 py-8 text-sm">Sök efter sportlag (t.ex. Arsenal, Brooklyn Nets), serier eller filmer...</div>
            </div>
        </div>
    </div>

    <!-- Datumväljare-modal -->
    <div id="date-picker-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-[#121216] border border-gray-800 w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white text-center">Välj datum</h3>
            <input type="date" id="custom-date-input" class="w-full bg-[#1c1c24] border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#ef4444]">
            <div class="flex space-x-3 pt-2">
                <button onclick="closeDatePicker()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl text-sm font-medium transition-colors">Avbryt</button>
                <button onclick="confirmCustomDate()" class="flex-1 bg-[#ef4444] hover:bg-red-600 text-white py-2.5 rounded-xl text-sm font-medium transition-colors">Flytta</button>
            </div>
        </div>
    </div>

    <script>
        // Startdata / State
        let scheduleData = JSON.parse(localStorage.getItem('nextweek_schedule')) || {
            "2026-10-04": [
                { id: "1", title: "New York Rangers vs Utah Mammoth", type: "sport", channel: "Viaplay", time: "00:00", completed: false },
                { id: "2", title: "Slow Horses - S04E05", type: "series", channel: "Apple TV+", time: "21:00", completed: false }
            ],
            "2026-10-07": [
                { id: "5", title: "Arsenal vs Chelsea", type: "sport", channel: "Viaplay / Viasat", time: "17:30", completed: false }
            ]
        };

        let selectedItemForDateMove = null;
        let draggedItemId = null;

        function getDaysArray() {
            let days = [];
            let today = new Date("2026-10-04");
            for (let i = -3; i <= 14; i++) {
                let d = new Date(today);
                d.setDate(today.getDate() + i);
                days.push({
                    dateStr: d.toISOString().split('T')[0],
                    displayDate: d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' }),
                    dayName: d.toLocaleDateString('sv-SE', { weekday: 'short' }),
                    isToday: i === 0
                });
            }
            return days;
        }

        function renderApp() {
            localStorage.setItem('nextweek_schedule', JSON.stringify(scheduleData));
            const container = document.getElementById('week-container');
            container.innerHTML = '';

            let days = getDaysArray();

            days.forEach(day => {
                let items = scheduleData[day.dateStr] || [];
                
                let dayCard = document.createElement('div');
                dayCard.className = `bg-[#121216] border ${day.isToday ? 'border-[#ef4444]/60 shadow-lg shadow-[#ef4444]/5' : 'border-gray-800/80'} rounded-2xl p-4 space-y-3 transition-all`;
                dayCard.setAttribute('data-date', day.dateStr);

                dayCard.addEventListener('dragover', (e) => e.preventDefault());
                dayCard.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedItemId) {
                        moveItemToDate(draggedItemId, day.dateStr);
                        draggedItemId = null;
                    }
                });

                let headerHtml = `
                    <div class="flex items-center justify-between border-b border-gray-800/60 pb-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-base font-bold text-white capitalize">${day.displayDate}</span>
                            ${day.isToday ? '<span class="bg-[#ef4444] text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Idag</span>' : ''}
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">${day.dayName}</span>
                            <button onclick="openSearchModal()" class="text-gray-500 hover:text-white p-1"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>
                `;

                let listHtml = `<div class="space-y-2.5 min-h-[40px]">`;
                if (items.length === 0) {
                    listHtml += `<div class="text-xs text-gray-600 italic py-2 text-center">Inga inplanerade aktiviteter</div>`;
                } else {
                    items.forEach((item) => {
                        listHtml += `
                            <div draggable="true" 
                                 ondragstart="draggedItemId = '${item.id}'"
                                 class="bg-[#1a1a22] border border-gray-800/80 rounded-xl p-3 flex items-center justify-between group hover:border-gray-700 transition-all cursor-grab active:cursor-grabbing">
                                <div class="flex items-center space-x-3 flex-1 min-w-0 pr-2">
                                    <button onclick="toggleComplete('${day.dateStr}', '${item.id}')" class="w-5 h-5 rounded-full border ${item.completed ? 'bg-[#ef4444] border-[#ef4444] text-white' : 'border-gray-600 hover:border-gray-400'} flex items-center justify-center text-xs transition-colors shrink-0">
                                        ${item.completed ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                                    </button>
                                    <div class="min-w-0 flex-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-[10px] font-medium px-2 py-0.5 rounded bg-gray-800 text-gray-300">${item.type === 'sport' ? 'Sport' : 'Serie/Film'}</span>
                                            <span class="text-[10px] text-gray-400 font-medium">${item.channel || 'Streaming'}</span>
                                        </div>
                                        <h4 class="text-sm font-semibold text-white truncate mt-0.5 ${item.completed ? 'line-through text-gray-500' : ''}">${item.title}</h4>
                                    </div>
                                </div>
                                <div class="relative">
                                    <button onclick="toggleDropdown('${item.id}', event)" class="w-8 h-8 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 flex items-center justify-center transition-colors">
                                        <i class="fa-solid fa-ellipsis-vertical"></i>
                                    </button>
                                    <div id="dropdown-${item.id}" class="hidden absolute right-0 mt-1 w-48 bg-[#1c1c24] border border-gray-800 rounded-xl shadow-xl z-30 py-1 text-xs">
                                        <button onclick="moveTomorrow('${day.dateStr}', '${item.id}')" class="w-full text-left px-4 py-2.5 text-gray-300 hover:bg-gray-800 hover:text-white flex items-center space-x-2">
                                            <i class="fa-solid fa-forward text-gray-400 w-4"></i><span>Flytta till imorgon</span>
                                        </button>
                                        <button onclick="moveNextWeek('${day.dateStr}', '${item.id}')" class="w-full text-left px-4 py-2.5 text-gray-300 hover:bg-gray-800 hover:text-white flex items-center space-x-2">
                                            <i class="fa-solid fa-calendar-week text-gray-400 w-4"></i><span>Nästa vecka</span>
                                        </button>
                                        <button onclick="openDatePicker('${day.dateStr}', '${item.id}')" class="w-full text-left px-4 py-2.5 text-gray-300 hover:bg-gray-800 hover:text-white flex items-center space-x-2">
                                            <i class="fa-solid fa-calendar-days text-gray-400 w-4"></i><span>Välj datum...</span>
                                        </button>
                                        <div class="border-t border-gray-800 my-1"></div>
                                        <button onclick="deleteItem('${day.dateStr}', '${item.id}')" class="w-full text-left px-4 py-2.5 text-red-400 hover:bg-red-500/10 flex items-center space-x-2">
                                            <i class="fa-solid fa-trash w-4"></i><span>Ta bort</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                listHtml += `</div>`;

                dayCard.innerHTML = headerHtml + listHtml;
                container.appendChild(dayCard);
            });
        }

        function scrollToToday() {
            setTimeout(() => {
                const todayCard = document.querySelector(`[data-date="2026-10-04"]`);
                if (todayCard) {
                    todayCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 100);
        }

        function openSearchModal() {
            document.getElementById('search-modal').classList.add('flex');
            document.getElementById('search-modal').classList.remove('hidden');
            document.getElementById('search-input').focus();
        }

        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('hidden');
            document.getElementById('search-modal').classList.remove('flex');
        }

        async function handleSearch(query) {
            const resultsContainer = document.getElementById('search-results');
            if (!query || query.trim().length < 2) {
                resultsContainer.innerHTML = `<div class="text-center text-gray-500 py-8 text-sm">Sök efter sportlag (t.ex. Arsenal, Brooklyn Nets), serier eller filmer...</div>`;
                return;
            }

            resultsContainer.innerHTML = `<div class="text-center text-gray-400 py-8 text-sm"><i class="fa-solid fa-spinner animate-spin mr-2"></i>Söker lag och matcher...</div>`;

            let q = query.toLowerCase();
            let html = '';

            // Om sökningen matchar sportlag
            if (q.includes('arsenal') || q.includes('brooklyn') || q.includes('nets') || q.includes('rangers') || q.includes('fc barcelona') || q.includes('liverpool') || q.includes('tottenham') || q.includes('chelsea')) {
                let teamName = q.includes('arsenal') ? 'Arsenal FC' : 
                               q.includes('brooklyn') || q.includes('nets') ? 'Brooklyn Nets' : 
                               q.includes('rangers') ? 'New York Rangers' : 
                               q.includes('liverpool') ? 'Liverpool FC' : 
                               q.includes('barcelona') ? 'FC Barcelona' : query;
                
                let channel = q.includes('arsenal') || q.includes('liverpool') || q.includes('barcelona') || q.includes('chelsea') ? 'Viaplay / Viasat' : 'Disney+ / NBA TV';
                
                html += `
                    <div class="bg-[#1c1c24] border border-gray-800 p-4 rounded-xl space-y-3">
                        <div class="flex items-center space-x-3">
                            <div class="w-12 h-12 bg-[#ef4444]/15 text-[#ef4444] rounded-xl flex items-center justify-center text-lg"><i class="fa-solid fa-shield-halved"></i></div>
                            <div>
                                <h4 class="text-base font-bold text-white">${teamName}</h4>
                                <p class="text-xs text-gray-400">Sportlag • Alla säsongens matcher</p>
                            </div>
                        </div>
                        <button onclick="addAllTeamMatches('${teamName}', '${channel}')" class="w-full bg-[#ef4444] hover:bg-red-600 text-white text-xs font-bold py-2.5 rounded-xl transition-colors flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-calendar-plus"></i>
                            <span>📅 Lägg till alla matcher för säsongen</span>
                        </button>
                    </div>
                `;
            }

            try {
                const response = await fetch(`[https://api.themoviedb.org/3/search/multi?api_key=3fd2be6f0c70a2a598f084ddfb75487c&language=sv-SE&query=$](https://api.themoviedb.org/3/search/multi?api_key=3fd2be6f0c70a2a598f084ddfb75487c&language=sv-SE&query=$){encodeURIComponent(query)}`);
                const data = await response.json();
                let results = data.results || [];

                results.forEach(item => {
                    if (item.media_type === 'movie' || item.media_type === 'tv') {
                        let title = item.title || item.name;
                        let date = item.release_date || item.first_air_date || '2026-10-04';
                        let type = item.media_type === 'tv' ? 'series' : 'movie';
                        let poster = item.poster_path ? `[https://image.tmdb.org/t/p/w92$](https://image.tmdb.org/t/p/w92$){item.poster_path}` : null;

                        html += `
                            <div onclick="addItemToCalendar('${title.replace(/'/g, "\\'")}', '${type}', 'Netflix / HBO', '${date}')" class="bg-[#1c1c24] hover:bg-gray-800 border border-gray-800 p-3 rounded-xl flex items-center justify-between cursor-pointer transition-colors">
                                <div class="flex items-center space-x-3">
                                    ${poster ? `<img src="${poster}" class="w-10 h-14 object-cover rounded-md">` : `<div class="w-10 h-14 bg-gray-800 rounded-md flex items-center justify-center text-gray-500"><i class="fa-solid fa-film"></i></div>`}
                                    <div>
                                        <h4 class="text-sm font-bold text-white">${title}</h4>
                                        <p class="text-xs text-gray-400">${type === 'series' ? 'TV-serie' : 'Film'} • ${date}</p>
                                    </div>
                                </div>
                                <span class="text-xs bg-[#ef4444] text-white px-3 py-1.5 rounded-lg font-medium">Lägg till</span>
                            </div>
                        `;
                    }
                });
            } catch (err) {}

            if (!html) {
                html = `<div class="text-center text-gray-500 py-8 text-sm">Inga träffar hittades. Testa sök på Arsenal, Brooklyn Nets eller en serie.</div>`;
            }

            resultsContainer.innerHTML = html;
        }

        function addAllTeamMatches(teamName, channel) {
            let matchOpponents = ["vs Manchester United", "vs Liverpool", "vs Tottenham", "vs Chelsea", "vs Manchester City", "vs Newcastle"];
            if (teamName.includes('Nets')) {
                matchOpponents = ["vs Boston Celtics", "vs New York Knicks", "vs Chicago Bulls", "vs Miami Heat", "vs Los Angeles Lakers"];
            } else if (teamName.includes('Rangers')) {
                matchOpponents = ["vs New Jersey Devils", "vs Philadelphia Flyers", "vs Washington Capitals", "vs Pittsburgh Penguins"];
            }

            let today = new Date("2026-10-04");
            matchOpponents.forEach((opp, index) => {
                let matchDate = new Date(today);
                matchDate.setDate(today.getDate() + (index * 3) + 1);
                let dateStr = matchDate.toISOString().split('T')[0];

                if (!scheduleData[dateStr]) scheduleData[dateStr] = [];
                scheduleData[dateStr].push({
                    id: '_' + Math.random().toString(36).substr(2, 9),
                    title: `${teamName} ${opp}`,
                    type: 'sport',
                    channel: channel,
                    time: "19:00",
                    completed: false
                });
            });

            closeSearchModal();
            renderApp();
        }

        function addItemToCalendar(title, type, channel, dateStr) {
            if (!scheduleData[dateStr]) dateStr = "2026-10-04";
            if (!scheduleData[dateStr]) scheduleData[dateStr] = [];

            scheduleData[dateStr].push({
                id: '_' + Math.random().toString(36).substr(2, 9),
                title: title,
                type: type,
                channel: channel,
                time: "20:00",
                completed: false
            });

            closeSearchModal();
            renderApp();
        }

        function toggleDropdown(id, event) {
            event.stopPropagation();
            let dropdown = document.getElementById(`dropdown-${id}`);
            document.querySelectorAll('[id^="dropdown-"]').forEach(el => {
                if (el.id !== `dropdown-${id}`) el.classList.add('hidden');
            });
            dropdown.classList.toggle('hidden');
        }

        window.addEventListener('click', () => {
            document.querySelectorAll('[id^="dropdown-"]').forEach(el => el.classList.add('hidden'));
        });

        function toggleComplete(dateStr, id) {
            let item = scheduleData[dateStr].find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                renderApp();
            }
        }

        function deleteItem(dateStr, id) {
            scheduleData[dateStr] = scheduleData[dateStr].filter(i => i.id !== id);
            renderApp();
        }

        function moveTomorrow(currentDateStr, id) {
            let itemIndex = scheduleData[currentDateStr].findIndex(i => i.id === id);
            if (itemIndex > -1) {
                let item = scheduleData[currentDateStr].splice(itemIndex, 1)[0];
                let currDate = new Date(currentDateStr);
                currDate.setDate(currDate.getDate() + 1);
                let nextDateStr = currDate.toISOString().split('T')[0];
                if (!scheduleData[nextDateStr]) scheduleData[nextDateStr] = [];
                scheduleData[nextDateStr].push(item);
                renderApp();
            }
        }
