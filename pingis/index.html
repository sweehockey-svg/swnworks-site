<script>
(()=>{'use strict';
const URL_BASE='https://pqaymcvlwsruxvekvvtl.supabase.co/rest/v1/', KEY='sb_publishable_XARUftv6YJUELo4jc8NIsA_mee9YHJV', ID='skolpingis';
const secret=decodeURIComponent(location.hash.slice(1)).replace(/^token=/,'');
const admin=location.search.includes('admin=1')&&secret.length>=32;
let data={name:'Skolans pingisturnering',format:'cup',players:[],matches:[],groups:4},tab=admin?'admin':'overview',busy=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), getPlayer=id=>data.players.find(p=>p.id===id),name=id=>getPlayer(id)?.name||'Väntar på spelare',done=m=>Number.isInteger(m.a)&&Number.isInteger(m.b)&&m.a!==m.b,win=m=>done(m)?(m.a>m.b?m.p1:m.p2):null;
const headers={'apikey':KEY,'Content-Type':'application/json'};
function flash(message,error=false){const e=$('#notice');e.textContent=message;e.className='notice'+(error?' error':'');setTimeout(()=>e.classList.add('hidden'),5000)}
async function load(quiet=false){try{const r=await fetch(URL_BASE+'pingis_events?select=id,data,updated_at&id=eq.'+ID,{headers});if(!r.ok)throw Error('Kunde inte läsa resultat');const arr=await r.json();if(arr[0])data={...data,...arr[0].data};render()}catch(e){if(!quiet)flash(e.message,true)}}
async function save(){if(!admin)return;busy=true;try{const r=await fetch(URL_BASE+'rpc/pingis_save',{method:'POST',headers,body:JSON.stringify({p_id:ID,p_token:secret,p_data:data})});if(!r.ok){const x=await r.json();throw Error(x.message||'Kunde inte spara')}flash('Ändringarna är sparade och syns på publika sidan.')}catch(e){flash(e.message,true)}finally{busy=false;render()}}
function setTab(t){tab=t;render()}

function stats(){let complete=data.matches.filter(done).length;$('#nplayers').textContent=data.players.length;$('#ngames').textContent=complete;$('#nremaining').textContent=data.matches.length-complete;$('#title').textContent=data.name}
function groupMatches(m){const groups={};for(const x of m){const key=x.stage||'Grundspel';(groups[key]??=[]).push(x)}return groups}
function matchCard(m,edit=false){const a=esc(name(m.p1)),b=esc(name(m.p2));if(!edit)return '<div class="match"><div class="mini muted">'+esc(m.stage||'Grundspel')+'</div><div class="names"><span>'+a+'</span><span class="result">'+(done(m)?m.a+'–'+m.b:'VS')+'</span><span>'+b+'</span></div></div>';
return '<div class="match editmatch"><div><strong>'+a+'</strong><div class="muted mini">mot '+b+'</div></div><input aria-label="Set '+a+'" type="number" min="0" max="99" id="a-'+m.id+'" value="'+(m.a??'')+'"><span>:</span><input aria-label="Set '+b+'" type="number" min="0" max="99" id="b-'+m.id+'" value="'+(m.b??'')+'"><button data-result="'+m.id+'">Spara</button></div>'}
function table(players,matches){const rows=players.map(p=>({p,w:0,l:0,sets:0,against:0,gp:0}));for(const m of matches.filter(done)){const a=rows.find(x=>x.p.id===m.p1),b=rows.find(x=>x.p.id===m.p2);if(!a||!b)continue;a.gp++;b.gp++;a.sets+=m.a;a.against+=m.b;b.sets+=m.b;b.against+=m.a;(m.a>m.b?a:b).w++;(m.a>m.b?b:a).l++}rows.sort((a,b)=>b.w-a.w||(b.sets-b.against)-(a.sets-a.against)||b.sets-a.sets||a.p.name.localeCompare(b.p.name,'sv'));return rows}
function standingsHTML(){if(!data.players.length)return '<div class="empty">Ingen tabell ännu. Lägg till spelare via admin.</div>';const groups=data.format==='groups'?[...new Set(data.players.map(p=>p.group||'Grupp A'))]:['Alla spelare'];return groups.map(g=>{const ps=g==='Alla spelare'?data.players:data.players.filter(p=>p.group===g);const mm=data.matches.filter(m=>m.type==='league'&&ps.some(p=>p.id===m.p1)&&ps.some(p=>p.id===m.p2));return '<h3 class="groupheading">'+esc(g)+'</h3><div class="panel table-wrap"><table><thead><tr><th>#</th><th>Spelare</th><th>MP</th><th>V</th><th>F</th><th>Set +/-</th><th>Diff</th></tr></thead><tbody>'+table(ps,mm).map((x,i)=>'<tr><td>'+(i+1)+'</td><td><strong>'+esc(x.p.name)+'</strong></td><td class="num">'+x.gp+'</td><td class="num">'+x.w+'</td><td class="num">'+x.l+'</td><td class="num">'+x.sets+' / '+x.against+'</td><td class="num">'+(x.sets-x.against)+'</td></tr>').join('')+'</tbody></table></div>'}).join('')}
function roundLabel(n){return n===2?'Final':n===4?'Semifinal':n===8?'Kvartsfinal':n===16?'Åttondelsfinal':'Omgång'}
function playoffsHTML(){const ms=data.matches.filter(m=>m.type==='cup');if(!ms.length)return '<div class="empty">Slutspelet är inte skapat ännu.</div>';const rounds=[...new Set(ms.map(m=>m.round))];return '<div class="panel"><div class="bracket">'+rounds.map(r=>{const mm=ms.filter(m=>m.round===r);return '<section class="round"><h3>'+roundLabel(mm.length*2)+'</h3>'+mm.map(m=>matchCard(m)).join('')+'</section>'}).join('')+'</div></div>'}
function overview(){const upcoming=data.matches.filter(m=>!done(m)&&m.p1&&m.p2).slice(0,6),recent=data.matches.filter(done).slice(-6).reverse();return '<div class="two"><section class="panel"><div class="sectionhead"><h2>Kommande matcher</h2></div>'+(upcoming.length?upcoming.map(m=>matchCard(m)).join(''):'<div class="empty">Inga kommande matcher ännu.</div>')+'</section><section class="panel"><h2>Senaste resultat</h2>'+(recent.length?recent.map(m=>matchCard(m)).join(''):'<div class="empty">Inga resultat registrerade ännu.</div>')+'</section></div>'}
function matches(){if(!data.matches.length)return '<div class="empty">Spelschemat är inte skapat ännu.</div>';const grouped=groupMatches(data.matches.filter(m=>m.type!=='cup'));return Object.entries(grouped).map(([k,ms])=>'<section class="panel"><h2>'+esc(k)+'</h2>'+ms.map(m=>matchCard(m)).join('')+'</section>').join('')+(data.matches.some(m=>m.type==='cup')?'<section class="panel"><h2>Slutspelsmatcher</h2>'+data.matches.filter(m=>m.type==='cup').map(m=>matchCard(m)).join('')+'</section>':'')}
function adminPanel(){return '<div class="notice">Administratörsvy. Dela bara den vanliga publika länken med eleverna, inte denna adminlänk.</div><section class="panel"><h2>Turneringsinställningar</h2><div class="split"><label>Namn på turneringen<input id="event-name" maxlength="100" value="'+esc(data.name)+'"></label><label>Spelformat<select id="format"><option value="roundrobin" '+(data.format==='roundrobin'?'selected':'')+'>Alla mot alla</option><option value="groups" '+(data.format==='groups'?'selected':'')+'>Gruppspel + slutspel</option><option value="cup" '+(data.format==='cup'?'selected':'')+'>Direktutslagning</option></select></label></div><p class="muted mini" id="format-help">'+(data.format==='groups'?'Spelarna delas automatiskt i grupper. De bästa går vidare till slutspel.':data.format==='cup'?'Alla spelare lottas in i ett utslagsträd. Vinnaren går vidare automatiskt.':'Alla möter alla och en tabell räknas automatiskt.')+' Resultat anges som vunna set, exempelvis 3–1.</p><div id="cup-mode-row" class="'+(data.format==='cup'?'':'hidden')+'" style="margin:16px 0"><label>Upplägg för cupspel<select id="cup-mode"><option value="fixed" '+(data.cupMode!=='redraw'?'selected':'')+'>Fast slutspelsträd</option><option value="redraw" '+(data.cupMode==='redraw'?'selected':'')+'>Ny lottning varje omgång</option></select></label><p class="muted mini">Vid ny lottning väljer admin när nästa omgång lottas, efter att alla matcher är färdiga.</p></div><div class="row"><button id="save-settings" class="primary">Spara inställningar</button></div></section><div class="two"><section class="panel"><h2>Deltagare ('+data.players.length+')</h2><form class="formrow" id="add-player"><input id="player-name" placeholder="Förnamn eller smeknamn" maxlength="60" required><button class="primary">Lägg till</button></form><div style="margin-top:18px"><label for="bulk-players" class="muted mini">Eller klistra in alla spelare, ett namn per rad:</label><textarea id="bulk-players" rows="7" placeholder="Spelare 1&#10;Spelare 2&#10;Spelare 3" style="width:100%;resize:vertical;min-height:135px;margin:9px 0;border:1px solid #36516a;border-radius:10px;background:#091a2c;color:white;padding:13px;font:inherit"></textarea><button id="bulk-add" class="primary" type="button">Lägg till hela listan</button></div><div id="player-list">'+data.players.map(p=>'<div class="row between" style="border-bottom:1px solid #28415a;padding:11px 0"><strong>'+esc(p.name)+'</strong><button data-remove="'+p.id+'">Ta bort</button></div>').join('')+'</div></section><section class="panel"><h2>Spelschema</h2><p class="muted">Skapa automatiskt matcher från deltagarlistan.</p><div class="row"><label id="group-options" style="flex:1;min-width:150px" class="'+(data.format==='groups'?'':'hidden')+'">Antal grupper<input id="group-count" type="number" min="2" max="16" value="'+(data.groups||4)+'"></label><button id="generate" class="primary">Lotta turnering</button></div><p class="mini muted">Obs! Generera igen ersätter befintliga matcher och resultat.</p>'+(data.format==='cup'&&data.cupMode==='redraw'?'<button id="next-round" style="margin:8px 0">Lotta nästa omgång</button>':'')+''+(data.format==='groups'?'<button id="make-playoffs">Skapa slutspel (topp 2 per grupp)</button>':'')+'</section></div><section class="panel"><h2>Registrera resultat</h2>'+(!data.matches.length?'<div class="empty">Generera matcher först.</div>':Object.entries(groupMatches(data.matches)).map(([k,ms])=>'<h3 class="groupheading">'+esc(k)+'</h3>'+ms.filter(m=>m.p1&&m.p2).map(m=>matchCard(m,true)).join('')).join(''))+'</section>'}
function render(){tabButtons();stats();$('#content').innerHTML=tab==='overview'?overview():tab==='matches'?matches():tab==='standings'?standingsHTML():tab==='playoffs'?playoffsHTML():admin?adminPanel():overview()}
function pairs(ps,stage,type='league'){const out=[];for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)out.push({id:crypto.randomUUID(),p1:ps[i].id,p2:ps[j].id,a:null,b:null,stage,type});return out}
function makeCup(ps){if(ps.length<2)return[];const mixed=[...ps];for(let i=mixed.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[mixed[i],mixed[j]]=[mixed[j],mixed[i]]}const size=2**Math.ceil(Math.log2(mixed.length)),rounds=Math.log2(size),byes=size-mixed.length,first=[];let cursor=0;for(let i=0;i<size/2;i++){if(i<byes)first.push([mixed[cursor++].id,null]);else first.push([mixed[cursor++].id,mixed[cursor++].id])}for(let i=first.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[first[i],first[j]]=[first[j],first[i]]}const ms=[];for(let r=0;r<rounds;r++){const count=size/2**(r+1);for(let j=0;j<count;j++){ms.push({id:crypto.randomUUID(),p1:r===0?first[j][0]:null,p2:r===0?first[j][1]:null,a:null,b:null,type:'cup',stage:roundLabel(count*2),round:r,slot:j})}}return ms}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function redrawStart(ps){const seeded=makeCup(ps);return seeded.filter(m=>m.round===0)}
function nextRound(){const cup=data.matches.filter(m=>m.type==='cup');if(!cup.length)return flash('Lotta den första omgången först.',true);const last=Math.max(...cup.map(m=>m.round)),current=cup.filter(m=>m.round===last);if(current.some(m=>m.p1&&m.p2&&!done(m)))return flash('Alla matcher i omgången måste spelas färdigt först.',true);const winners=current.map(m=>win(m)||(m.p1&&!m.p2?m.p1:null)).filter(Boolean);if(winners.length<=1)return flash('Turneringen är redan avgjord.',true);if(cup.some(m=>m.round===last+1))return flash('Nästa omgång finns redan.',true);const shuffled=shuffle(winners);const next=[];for(let i=0;i<shuffled.length;i+=2)next.push({id:crypto.randomUUID(),p1:shuffled[i],p2:shuffled[i+1]||null,a:null,b:null,type:'cup',round:last+1,slot:i/2,stage:roundLabel(shuffled.length)});data.matches.push(...next);save()}
function propagate(){if(data.cupMode==='redraw')return;const rounds=[...new Set(data.matches.filter(m=>m.type==='cup').map(m=>m.round))].sort((a,b)=>a-b);for(const r of rounds.slice(1)){for(const m of data.matches.filter(m=>m.type==='cup'&&m.round===r)){const previous=data.matches.filter(x=>x.type==='cup'&&x.round===r-1);const source1=previous[m.slot*2],source2=previous[m.slot*2+1];const first=source1?(win(source1)||(!source1.p2?source1.p1:null)):null,second=source2?(win(source2)||(!source2.p2?source2.p1:null)):null;if(m.p1!==first||m.p2!==second){m.p1=first;m.p2=second;m.a=null;m.b=null}}}}
function generate(){if(data.players.length<2)return flash('Lägg till minst två spelare.',true);if(data.matches.length&&!confirm('Det gamla spelschemat och alla resultat ersätts. Fortsätta?'))return;
const ps=[...data.players];data.players.forEach(p=>delete p.group);if(data.format==='roundrobin'){data.matches=pairs(ps,'Alla mot alla')}else if(data.format==='cup'){data.matches=data.cupMode==='redraw'?redrawStart(ps):makeCup(ps);propagate()}else{const n=Math.max(2,Math.min(16,Number($('#group-count').value)||4,Math.floor(ps.length/2)));data.groups=n;ps.forEach((p,i)=>p.group='Grupp '+String.fromCharCode(65+i%n));data.matches=Array.from({length:n},(_,i)=>pairs(ps.filter(p=>p.group==='Grupp '+String.fromCharCode(65+i)),'Grupp '+String.fromCharCode(65+i))).flat()}save()}
function startPlayoffs(){const league=data.matches.filter(m=>m.type==='league');if(league.some(m=>!done(m)))return flash('Alla gruppspelsmatcher måste vara färdigspelade först.',true);const groups=[...new Set(data.players.map(p=>p.group))],qual=groups.flatMap(g=>{const ps=data.players.filter(p=>p.group===g);return table(ps,league.filter(m=>ps.some(p=>p.id===m.p1))).slice(0,2).map(r=>r.p)});if(qual.length<2)return flash('För få kvalificerade spelare.',true);if(data.matches.some(m=>m.type==='cup')&&!confirm('Ersätta befintligt slutspel?'))return;data.matches=data.matches.filter(m=>m.type!=='cup').concat(makeCup(qual));propagate();save()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.dataset.tab)return setTab(b.dataset.tab);if(!admin)return;if(b.id==='save-settings'){const v=$('#event-name').value.trim();if(!v)return flash('Ange ett turneringsnamn.',true);const f=$('#format').value,mode=$('#cup-mode').value;if(f==='cup'&&mode!==(data.cupMode||'fixed')&&data.matches.some(m=>m.type==='cup'))return flash('Byt inte lottningssätt mitt i en pågående cup. Avsluta eller skapa om spelschemat först.',true);if(f!==data.format&&data.matches.length&&!confirm('Byte av format tar bort spelschemat. Fortsätta?'))return;if(f!==data.format)data.matches=[];data.name=v;data.format=f;data.cupMode=mode;return save()}if(b.id==='bulk-add'){const names=$('#bulk-players').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!names.length)return flash('Klistra in ett namn per rad.',true);const existing=new Set(data.players.map(p=>p.name.toLocaleLowerCase('sv'))),unique=[];for(const n of names){if(n.length>60)continue;const key=n.toLocaleLowerCase('sv');if(!existing.has(key)){existing.add(key);unique.push(n)}}if(!unique.length)return flash('Inga nya spelare att lägga till.',true);if(data.matches.length&&!confirm('Lägga till spelare och nollställa spelschemat?'))return;data.players.push(...unique.map(name=>({id:crypto.randomUUID(),name})));data.matches=[];flash(unique.length+' spelare tillagda.');return save()}if(b.id==='generate')return generate();if(b.id==='next-round')return nextRound();if(b.id==='make-playoffs')return startPlayoffs();if(b.dataset.remove){if(data.matches.length&&!confirm('Ta bort spelaren och nollställ spelschemat?'))return;data.players=data.players.filter(p=>p.id!==b.dataset.remove);data.matches=[];return save()}if(b.dataset.result){const m=data.matches.find(m=>m.id===b.dataset.result),va=$('#a-'+m.id).value,vb=$('#b-'+m.id).value;if(va===''&&vb===''){m.a=null;m.b=null}else{if(va===''||vb===''||Number(va)===Number(vb)||Number(va)<0||Number(vb)<0)return flash('Ange två olika, positiva setresultat.',true);m.a=Number(va);m.b=Number(vb)}propagate();return save()}});
document.addEventListener('change',e=>{if(e.target.id!=='format'||!admin)return;const format=e.target.value;$('#group-options').classList.toggle('hidden',format!=='groups');$('#cup-mode-row').classList.toggle('hidden',format!=='cup');$('#format-help').textContent=(format==='groups'?'Spelarna delas automatiskt i grupper. De bästa går vidare till slutspel.':format==='cup'?'Alla spelare lottas in i ett utslagsträd. Vinnaren går vidare automatiskt.':'Alla möter alla och en tabell räknas automatiskt.')+' Resultat anges som vunna set, exempelvis 3–1.'});
document.addEventListener('submit',e=>{if(e.target.id!=='add-player'||!admin)return;e.preventDefault();const v=$('#player-name').value.trim();if(!v)return;if(data.players.some(p=>p.name.toLocaleLowerCase('sv')===v.toLocaleLowerCase('sv')))return flash('Spelaren finns redan.',true);if(data.matches.length&&!confirm('Lägga till spelare och nollställa spelschemat?'))return;data.players.push({id:crypto.randomUUID(),name:v});data.matches=[];save()});
load();if(!admin)setInterval(()=>{if(!document.hidden)load(true)},15000);
})();
</script></body></html>
