<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#081327"><title>Pingisturnering | SWNWORKS</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#edf6ff;background:#081327}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#234164 0,transparent 38%),#081327}a{color:inherit}.wrap{max-width:1220px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.16em;text-decoration:none;font-size:13px}.tag{font-size:12px;color:#83a8c8;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero{padding:60px 0 35px}.hero h1{font-size:clamp(36px,6vw,74px);letter-spacing:-.055em;line-height:1.03;margin:10px 0 16px}.hero p{color:#acc6da;font-size:17px;max-width:650px}.accent{color:#8ee0db}.pill{display:inline-flex;background:#1b384d;padding:8px 13px;border-radius:40px;font-size:12px;color:#9ae4dd;font-weight:800}.tabs{display:flex;gap:7px;overflow:auto;padding:8px 0 20px}.tabs button{white-space:nowrap}button,.btn{cursor:pointer;color:#e8f7ff;border:1px solid #38516a;background:#172b42;padding:11px 17px;border-radius:11px;font:inherit;font-weight:700;text-decoration:none}button:hover,.btn:hover{border-color:#65cfc8}button.active,.primary{color:#061b27;background:#78ddd4;border-color:#78ddd4}button:disabled{opacity:.4;cursor:not-allowed}.panel{border:1px solid #28415a;background:#101f34;border-radius:18px;padding:23px;margin-bottom:16px;box-shadow:0 8px 28px #0002}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.stats{margin-bottom:16px}.stat{background:#122840;padding:21px;border-radius:15px;border:1px solid #29425b}.stat b{font-size:32px;display:block}.stat small{color:#9eb7cd}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#92abc2}.mini{font-size:12px}.match{border:1px solid #284a60;border-radius:13px;padding:15px;background:#132a42;margin:10px 0}.match .names{display:flex;justify-content:space-between;gap:14px;font-size:17px;font-weight:800;margin:8px 0}.match .result{font-size:19px;color:#86e0d7;font-weight:900}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:400px}th,td{text-align:left;border-bottom:1px solid #294059;padding:12px 9px}th{font-size:12px;color:#87a9c4;text-transform:uppercase}td.num{text-align:center;font-variant-numeric:tabular-nums}input,select{width:100%;padding:12px 13px;background:#091a2c;border:1px solid #36516a;border-radius:10px;color:white;font:inherit}input:focus,select:focus{outline:2px solid #61d4ce}.formrow{display:grid;grid-template-columns:1fr auto;gap:8px}.formrow.third{grid-template-columns:1fr 1fr auto}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editmatch{display:grid;grid-template-columns:1fr 65px 20px 65px auto;align-items:center;gap:8px}.editmatch input{text-align:center;padding:10px 5px}.empty{padding:40px 14px;text-align:center;color:#a5bed1;border:1px dashed #385772;border-radius:15px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.groupheading{color:#85e1d7;margin:26px 0 8px}.notice{background:#183b43;border:1px solid #2d7771;padding:13px 16px;border-radius:12px;color:#b7f8ef;margin-bottom:16px}.error{background:#47232b;border-color:#9b4551;color:#ffd7de}.hidden{display:none!important}.footer{color:#7594b0;text-align:center;padding:36px 0;font-size:12px}.bracket{display:flex;overflow:auto;gap:20px;padding-bottom:18px}.round{min-width:230px;flex:1}.round h3{font-size:13px;letter-spacing:.1em;color:#8db3cd;text-transform:uppercase}
@media(max-width:760px){.wrap{padding:15px}.hero{padding:36px 0 20px}.grid,.two,.split{grid-template-columns:1fr}.panel{padding:16px}.editmatch{grid-template-columns:1fr 42px 10px 42px;gap:5px}.editmatch button{grid-column:1/-1}.editmatch input{padding:9px 2px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:12px}.stat b{font-size:23px}.stat small{font-size:11px}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="/">SWNWORKS <span class="accent">/ PINGIS</span></a><span class="pill">SKOLTURNERING</span></header><section class="hero"><span class="tag">PINGIS · LIVE RESULTAT</span><h1 id="title">Skolans <span class="accent">pingisturnering</span></h1><p>Matcher, resultat och tabeller. Allt på samma ställe.</p></section><div id="notice" role="status" class="hidden"></div><div class="grid stats"><div class="stat"><b id="nplayers">0</b><small>Deltagare</small></div><div class="stat"><b id="ngames">0</b><small>Spelade matcher</small></div><div class="stat"><b id="nremaining">0</b><small>Matcher kvar</small></div></div><nav class="tabs" id="tabs"><button data-tab="overview" class="active">Översikt</button><button data-tab="matches">Matcher</button><button data-tab="standings">Tabell</button><button data-tab="playoffs">Slutspel</button><button data-tab="admin" id="admin-tab" class="hidden">Administration</button></nav><main id="content"></main><footer class="footer">PINGISTURNERING · POWERED BY SWNWORKS</footer></div>
<script>
(()=>{'use strict';
const URL_BASE='https://pqaymcvlwsruxvekvvtl.supabase.co/rest/v1/', KEY='sb_publishable_XARUftv6YJUELo4jc8NIsA_mee9YHJV', ID='skolpingis';
const secret=decodeURIComponent(location.hash.slice(1)).replace(/^token=/,'');
const admin=location.search.includes('admin=1')&&secret.length>=32;
let data={name:'Skolans pingisturnering',format:'roundrobin',players:[],matches:[],groups:4},tab=admin?'admin':'overview',busy=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), getPlayer=id=>data.players.find(p=>p.id===id),name=id=>getPlayer(id)?.name||'Väntar på spelare',done=m=>Number.isInteger(m.a)&&Number.isInteger(m.b)&&m.a!==m.b,win=m=>done(m)?(m.a>m.b?m.p1:m.p2):null;
const headers={'apikey':KEY,'Content-Type':'application/json'};
function flash(message,error=false){const e=$('#notice');e.textContent=message;e.className='notice'+(error?' error':'');setTimeout(()=>e.classList.add('hidden'),5000)}
async function load(quiet=false){try{const r=await fetch(URL_BASE+'pingis_events?select=id,data,updated_at&id=eq.'+ID,{headers});if(!r.ok)throw Error('Kunde inte läsa resultat');const arr=await r.json();if(arr[0])data={...data,...arr[0].data};render()}catch(e){if(!quiet)flash(e.message,true)}}
async function save(){if(!admin)return;busy=true;try{const r=await fetch(URL_BASE+'rpc/pingis_save',{method:'POST',headers,body:JSON.stringify({p_id:ID,p_token:secret,p_data:data})});if(!r.ok){const x=await r.json();throw Error(x.message||'Kunde inte spara')}flash('Ändringarna är sparade och syns på publika sidan.')}catch(e){flash(e.message,true)}finally{busy=false;render()}}
function setTab(t){tab=t;render()}
function tabButtons(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.classList.toggle('hidden',b.dataset.tab==='admin'&&!admin)})}
function stats(){let complete=data.matches.filter(done).length;$('#nplayers').textContent=data.players.length;$('#ngames').textContent=complete;$('#nremaining').textContent=data.matches.length-complete;$('#title').textContent=data.name}
function groupMatches(m){const groups={};for(const x of m){const key=x.stage||'Grundspel';(groups[key]??=[]).push(x)}return groups}
function matchCard(m,edit=false){const a=esc(name(m.p1)),b=esc(name(m.p2));if(!edit)return '<div class="match"><div class="mini muted">'+esc(m.stage||'Grundspel')+'</div><div class="names"><span>'+a+'</span><span class="result">'+(done(m)?m.a+'–'+m.b:'VS')+'</span><span>'+b+'</span></div></div>';
return '<div class="match editmatch"><div><strong>'+a+'</strong><div class="muted mini">mot '+b+'</div></div><input aria-label="Set '+a+'" type="number" min="0" max="99" id="a-'+m.id+'" value="'+(m.a??'')+'"><span>:</span><input aria-label="Set '+b+'" type="number" min="0" max="99" id="b-'+m.id+'" value="'+(m.b??'')+'"><button data-result="'+m.id+'">Spara</button></div>'}
function table(players,matches){const rows=players.map(p=>({p,w:0,l:0,sets:0,against:0,gp:0}));for(const m of matches.filter(done)){const a=rows.find(x=>x.p.id===m.p1),b=rows.find(x=>x.p.id===m.p2);if(!a||!b)continue;a.gp++;b.gp++;a.sets+=m.a;a.against+=m.b;b.sets+=m.b;b.against+=m.a;(m.a>m.b?a:b).w++;(m.a>m.b?b:a).l++}rows.sort((a,b)=>b.w-a.w||(b.sets-b.against)-(a.sets-a.against)||b.sets-a.sets||a.p.name.localeCompare(b.p.name,'sv'));return rows}
function standingsHTML(){if(!data.players.length)return '<div class="empty">Ingen tabell ännu. Lägg till spelare via admin.</div>';const groups=data.format==='groups'?[...new Set(data.players.map(p=>p.group||'Grupp A'))]:['Alla spelare'];return groups.map(g=>{const ps=g==='Alla spelare'?data.players:data.players.filter(p=>p.group===g);const mm=data.matches.filter(m=>m.type==='league'&&ps.some(p=>p.id===m.p1)&&ps.some(p=>p.id===m.p2));return '<h3 class="groupheading">'+esc(g)+'</h3><div class="panel table-wrap"><table><thead><tr><th>#</th><th>Spelare</th><th>MP</th><th>V</th><th>F</th><th>Set +/-</th><th>Diff</th></tr></thead><tbody>'+table(ps,mm).map((x,i)=>'<tr><td>'+(i+1)+'</td><td><strong>'+esc(x.p.name)+'</strong></td><td class="num">'+x.gp+'</td><td class="num">'+x.w+'</td><td class="num">'+x.l+'</td><td class="num">'+x.sets+' / '+x.against+'</td><td class="num">'+(x.sets-x.against)+'</td></tr>').join('')+'</tbody></table></div>'}).join('')}
function roundLabel(n){return n===2?'Final':n===4?'Semifinal':n===8?'Kvartsfinal':n===16?'Åttondelsfinal':'Omgång'}
function playoffsHTML(){const ms=data.matches.filter(m=>m.type==='cup');if(!ms.length)return '<div class="empty">Slutspelet är inte skapat ännu.</div>';const rounds=[...new Set(ms.map(m=>m.round))];return '<div class="panel"><div class="bracket">'+rounds.map(r=>{const mm=ms.filter(m=>m.round===r);return '<section class="round"><h3>'+roundLabel(mm.length*2)+'</h3>'+mm.map(m=>matchCard(m)).join('')+'</section>'}).join('')+'</div></div>'}
function overview(){const upcoming=data.matches.filter(m=>!done(m)&&m.p1&&m.p2).slice(0,6),recent=data.matches.filter(done).slice(-6).reverse();return '<div class="two"><section class="panel"><div class="sectionhead"><h2>Kommande matcher</h2></div>'+(upcoming.length?upcoming.map(m=>matchCard(m)).join(''):'<div class="empty">Inga kommande matcher ännu.</div>')+'</section><section class="panel"><h2>Senaste resultat</h2>'+(recent.length?recent.map(m=>matchCard(m)).join(''):'<div class="empty">Inga resultat registrerade ännu.</div>')+'</section></div>'}
function matches(){if(!data.matches.length)return '<div class="empty">Spelschemat är inte skapat ännu.</div>';const grouped=groupMatches(data.matches.filter(m=>m.type!=='cup'));return Object.entries(grouped).map(([k,ms])=>'<section class="panel"><h2>'+esc(k)+'</h2>'+ms.map(m=>matchCard(m)).join('')+'</section>').join('')+(data.matches.some(m=>m.type==='cup')?'<section class="panel"><h2>Slutspelsmatcher</h2>'+data.matches.filter(m=>m.type==='cup').map(m=>matchCard(m)).join('')+'</section>':'')}
function adminPanel(){return '<div class="notice">Administratörsvy. Dela bara den vanliga publika länken med eleverna, inte denna adminlänk.</div><section class="panel"><h2>Turneringsinställningar</h2><div class="split"><label>Namn på turneringen<input id="event-name" maxlength="100" value="'+esc(data.name)+'"></label><label>Spelformat<select id="format"><option value="roundrobin" '+(data.format==='roundrobin'?'selected':'')+'>Alla mot alla</option><option value="groups" '+(data.format==='groups'?'selected':'')+'>Gruppspel + slutspel</option><option value="cup" '+(data.format==='cup'?'selected':'')+'>Direktutslagning</option></select></label></div><p class="muted mini">Gruppspel delas automatiskt i grupper. Resultat anges som vunna set, exempelvis 3–1.</p><div class="row"><button id="save-settings" class="primary">Spara inställningar</button></div></section><div class="two"><section class="panel"><h2>Deltagare ('+data.players.length+')</h2><form class="formrow" id="add-player"><input id="player-name" placeholder="Förnamn eller smeknamn" maxlength="60" required><button class="primary">Lägg till</button></form><div id="player-list">'+data.players.map(p=>'<div class="row between" style="border-bottom:1px solid #28415a;padding:11px 0"><strong>'+esc(p.name)+'</strong><button data-remove="'+p.id+'">Ta bort</button></div>').join('')+'</div></section><section class="panel"><h2>Spelschema</h2><p class="muted">Skapa automatiskt matcher från deltagarlistan.</p><div class="row"><label style="flex:1;min-width:150px">Antal grupper<input id="group-count" type="number" min="2" max="16" value="'+(data.groups||4)+'"></label><button id="generate" class="primary">Generera matcher</button></div><p class="mini muted">Obs! Generera igen ersätter befintliga matcher och resultat.</p>'+(data.format==='groups'?'<button id="make-playoffs">Skapa slutspel (topp 2 per grupp)</button>':'')+'</section></div><section class="panel"><h2>Registrera resultat</h2>'+(!data.matches.length?'<div class="empty">Generera matcher först.</div>':Object.entries(groupMatches(data.matches)).map(([k,ms])=>'<h3 class="groupheading">'+esc(k)+'</h3>'+ms.filter(m=>m.p1&&m.p2).map(m=>matchCard(m,true)).join('')).join(''))+'</section>'}
function render(){tabButtons();stats();$('#content').innerHTML=tab==='overview'?overview():tab==='matches'?matches():tab==='standings'?standingsHTML():tab==='playoffs'?playoffsHTML():admin?adminPanel():overview()}
function pairs(ps,stage,type='league'){const out=[];for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)out.push({id:crypto.randomUUID(),p1:ps[i].id,p2:ps[j].id,a:null,b:null,stage,type});return out}
function makeCup(ps){if(ps.length<2)return[];const size=2**Math.ceil(Math.log2(ps.length)),rounds=Math.log2(size);let ms=[],prev=[];for(let r=0;r<rounds;r++){const count=size/2**(r+1),current=[];for(let j=0;j<count;j++){const m={id:crypto.randomUUID(),p1:r===0?(ps[j*2]?.id||null):null,p2:r===0?(ps[j*2+1]?.id||null):null,a:null,b:null,type:'cup',stage:roundLabel(count*2),round:r,slot:j};current.push(m);ms.push(m)}prev=current}return ms}
function propagate(){const rounds=[...new Set(data.matches.filter(m=>m.type==='cup').map(m=>m.round))].sort((a,b)=>a-b);for(const r of rounds.slice(1)){for(const m of data.matches.filter(m=>m.type==='cup'&&m.round===r)){const previous=data.matches.filter(x=>x.type==='cup'&&x.round===r-1);const source1=previous[m.slot*2],source2=previous[m.slot*2+1];const first=source1?(win(source1)||(!source1.p2?source1.p1:null)):null,second=source2?(win(source2)||(!source2.p2?source2.p1:null)):null;if(m.p1!==first||m.p2!==second){m.p1=first;m.p2=second;m.a=null;m.b=null}}}}
function generate(){if(data.players.length<2)return flash('Lägg till minst två spelare.',true);if(data.matches.length&&!confirm('Det gamla spelschemat och alla resultat ersätts. Fortsätta?'))return;
const ps=[...data.players];data.players.forEach(p=>delete p.group);if(data.format==='roundrobin'){data.matches=pairs(ps,'Alla mot alla')}else if(data.format==='cup'){data.matches=makeCup(ps);propagate()}else{const n=Math.max(2,Math.min(16,Number($('#group-count').value)||4,Math.floor(ps.length/2)));data.groups=n;ps.forEach((p,i)=>p.group='Grupp '+String.fromCharCode(65+i%n));data.matches=Array.from({length:n},(_,i)=>pairs(ps.filter(p=>p.group==='Grupp '+String.fromCharCode(65+i)),'Grupp '+String.fromCharCode(65+i))).flat()}save()}
function startPlayoffs(){const league=data.matches.filter(m=>m.type==='league');if(league.some(m=>!done(m)))return flash('Alla gruppspelsmatcher måste vara färdigspelade först.',true);const groups=[...new Set(data.players.map(p=>p.group))],qual=groups.flatMap(g=>{const ps=data.players.filter(p=>p.group===g);return table(ps,league.filter(m=>ps.some(p=>p.id===m.p1))).slice(0,2).map(r=>r.p)});if(qual.length<2)return flash('För få kvalificerade spelare.',true);if(data.matches.some(m=>m.type==='cup')&&!confirm('Ersätta befintligt slutspel?'))return;data.matches=data.matches.filter(m=>m.type!=='cup').concat(makeCup(qual));propagate();save()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.dataset.tab)return setTab(b.dataset.tab);if(!admin)return;if(b.id==='save-settings'){const v=$('#event-name').value.trim();if(!v)return flash('Ange ett turneringsnamn.',true);const f=$('#format').value;if(f!==data.format&&data.matches.length&&!confirm('Byte av format tar bort spelschemat. Fortsätta?'))return;if(f!==data.format)data.matches=[];data.name=v;data.format=f;return save()}if(b.id==='generate')return generate();if(b.id==='make-playoffs')return startPlayoffs();if(b.dataset.remove){if(data.matches.length&&!confirm('Ta bort spelaren och nollställ spelschemat?'))return;data.players=data.players.filter(p=>p.id!==b.dataset.remove);data.matches=[];return save()}if(b.dataset.result){const m=data.matches.find(m=>m.id===b.dataset.result),va=$('#a-'+m.id).value,vb=$('#b-'+m.id).value;if(va===''&&vb===''){m.a=null;m.b=null}else{if(va===''||vb===''||Number(va)===Number(vb)||Number(va)<0||Number(vb)<0)return flash('Ange två olika, positiva setresultat.',true);m.a=Number(va);m.b=Number(vb)}propagate();return save()}});
document.addEventListener('submit',e=>{if(e.target.id!=='add-player'||!admin)return;e.preventDefault();const v=$('#player-name').value.trim();if(!v)return;if(data.players.some(p=>p.name.toLocaleLowerCase('sv')===v.toLocaleLowerCase('sv')))return flash('Spelaren finns redan.',true);if(data.matches.length&&!confirm('Lägga till spelare och nollställa spelschemat?'))return;data.players.push({id:crypto.randomUUID(),name:v});data.matches=[];save()});
load();if(!admin)setInterval(()=>{if(!document.hidden)load(true)},15000);
})();
</script></body></html>
